/* ============ Ngwe Chay Yar — Admin · design tokens copied verbatim from UI11 ============ */
:root{
  --ink:#101410; --ink2:#2A332A; --muted:#5F6B5F;
  --green:#16A34A; --green-b:#22C55E; --green-xl:#4ADE80; --mint:#DCFCE7; --mint2:#BBF7D0;
  --deep:#14532D; --deep2:#0B3D24; --exp-red:#D92D20;
  --hair:rgba(16,20,16,.07); --hair2:rgba(16,20,16,.05);
  --glass:rgba(255,255,255,.58);
  --glass-brd:rgba(255,255,255,.75);
  --shadow:0 12px 40px rgba(11,61,36,.10);
  --shadow-sm:0 4px 18px rgba(11,61,36,.07);
  --r:20px;
  --bg:#F4F7F4; --glass-hi:rgba(255,255,255,.62); --glass-lo:rgba(255,255,255,.48); --glass-menu:rgba(255,255,255,.92);
  --field-bg:rgba(255,255,255,.55); --field-brd:rgba(255,255,255,.75);
  --mint-glass:rgba(34,197,94,.10); --gridline:rgba(16,20,16,.05); --track:rgba(16,20,16,.08);
  --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"Noto Sans Myanmar","Pyidaungsu",sans-serif;
  --myfont:"Noto Sans Myanmar","Pyidaungsu",-apple-system,"Segoe UI",Roboto,sans-serif;
}
html{color-scheme:light}
html[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.orb.o1{width:520px;height:520px;background:rgba(20,83,45,.20);top:-180px;right:-120px}
.orb.o2{width:460px;height:460px;background:rgba(34,197,94,.16);bottom:-160px;left:-140px}
.orb.o3{width:380px;height:380px;background:rgba(95,107,95,.14);top:38%;left:44%}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit}
img{display:block}
.num,.sv,.wv,.ta,.big,.amt,.dv,b,strong{font-variant-numeric:tabular-nums}
.my{font-family:var(--myfont);letter-spacing:0!important;text-transform:none!important;line-height:1.9;overflow-wrap:normal;white-space:normal}
.lbl,.sl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.green-t{color:var(--green)}
.red-t{color:var(--exp-red)}

/* ============ admin layout ============ */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100dvh}
.sidebar{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:20px 16px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border-right:1px solid var(--glass-brd);box-shadow:var(--shadow-sm)}
.brandrow{display:flex;align-items:center;gap:11px;min-width:0;padding:2px 4px 14px}
.logo-tile{flex:none;width:42px;height:42px;border-radius:12px;background:#111111;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.logo-tile img{width:100%;height:100%;object-fit:cover}
.brand-name{font-weight:700;font-size:15.5px;line-height:1.25;white-space:nowrap}
.brand-tag{font-size:10px;letter-spacing:.14em;color:var(--green);font-weight:700}
.admin-pill{margin-left:auto;flex:none;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--ink);color:#fff}
.side-nav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.side-nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:1px solid transparent;background:transparent;
  padding:11px 12px;border-radius:14px;font-size:14.5px;font-weight:600;color:var(--ink2)}
.side-nav button svg{flex:none;color:var(--muted)}
.side-nav button.active{background:var(--mint-glass);color:var(--deep);border-color:var(--hair)}
.side-nav button.active svg{color:var(--green)}
.side-foot{margin-top:auto;border-top:1px solid var(--hair);padding-top:14px}
.admin-prof{display:flex;align-items:center;gap:11px;padding:4px}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--green-b),var(--green));color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.admin-prof .an{font-weight:700;font-size:14px;line-height:1.3}
.admin-prof .ar{font-size:12px;color:var(--muted)}
.main{min-width:0;padding:22px 26px 60px;max-width:1180px;width:100%;margin:0 auto}
.topbar{position:sticky;top:14px;z-index:50;display:flex;align-items:center;gap:12px;margin-bottom:20px;
  background:var(--glass-hi);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow-sm);border-radius:18px;padding:10px 12px}
.topbar h1{font-size:19px;margin:0 6px;white-space:nowrap}
.top-search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--field-bg);border:1px solid var(--field-brd);border-radius:999px;padding:8px 14px}
.top-search svg{flex:none;color:var(--muted)}
.top-search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px;color:var(--ink)}
.iconbtn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-brd);background:var(--glass);
  display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.langbtn{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--glass-brd);background:var(--glass);
  border-radius:999px;padding:9px 14px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.mobbrand{display:none}
.page{display:none;flex-direction:column;gap:18px}
.page.active{display:flex}
.card{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow);border-radius:var(--r);padding:20px}
.card h3{margin:0 0 4px;font-size:16px}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow-sm);border-radius:var(--r);padding:16px 18px}
.stat .sv{font-size:27px;font-weight:800;margin-top:4px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.flowrow{display:grid;grid-template-columns:110px 1fr 130px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair2)}
.flowrow:last-child{border-bottom:0}
.flowrow .fl{font-weight:600;font-size:13.5px}
.flowrow .fv{text-align:right;font-weight:800;font-size:16px}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-b),var(--green))}
.bar>i.exp{background:var(--exp-red)}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.chart .col i{display:block;width:min(38px,70%);border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,var(--green-b),var(--green))}
.chart .col .cv{font-size:11.5px;font-weight:700;color:var(--ink2)}
.chart .col .cm{font-size:11.5px;color:var(--muted)}
.urow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair2)}
.urow:last-child{border-bottom:0}
.urow .avatar{width:36px;height:36px;font-size:14px}
.urow .un{font-weight:600;font-size:14px;line-height:1.35}
.urow .uu{font-size:12.5px;color:var(--muted)}
.urow .ur{margin-left:auto;text-align:right}
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair2);font-size:14px}
.trow:last-child{border-bottom:0}
.trow .ta{margin-left:auto;font-weight:700;white-space:nowrap}
.trow .tc{color:var(--muted);font-size:12.5px}
.tablewrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair)}
td{padding:11px 10px;border-bottom:1px solid var(--hair2);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:0}
.ucell{display:flex;align-items:center;gap:11px;min-width:190px}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.on{background:var(--mint);color:var(--deep)}
.pill.off{background:var(--track);color:var(--muted)}
.abtn{border:1px solid var(--glass-brd);background:var(--glass);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap}
.abtn.warn{color:var(--exp-red)}
.searchline{display:flex;align-items:center;gap:8px;background:var(--field-bg);border:1px solid var(--field-brd);border-radius:999px;padding:9px 15px;margin-bottom:8px}
.searchline input{flex:1;border:0;background:transparent;outline:none;font-size:14px;color:var(--ink);min-width:0}
.searchline svg{color:var(--muted);flex:none}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.fpill{border:1px solid var(--glass-brd);background:var(--glass);border-radius:999px;padding:8px 16px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.fpill.active{background:var(--ink);color:#fff;border-color:transparent}
.convrow{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair2);align-items:flex-start}
.convrow:last-child{border-bottom:0}
.convrow .avatar{width:38px;height:38px;font-size:13px}
.convrow .cn{font-weight:600;font-size:14px}
.convrow .cs{color:var(--muted);font-size:13px;margin-top:1px}
.convrow .ct{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;padding-top:3px}
.setrow{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--hair2)}
.setrow:last-child{border-bottom:0}
.setrow .st{font-weight:600;font-size:14.5px}
.setrow .ss{color:var(--muted);font-size:13px;margin-top:1px}
.switch{margin-left:auto;flex:none;position:relative;width:50px;height:29px;border-radius:99px;background:var(--track);border:1px solid var(--hair);transition:background .15s}
.switch .knob{position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:left .15s}
.switch.on{background:var(--green)}
.switch.on .knob{left:23px}
.notecard{border:1px dashed var(--glass-brd);background:var(--glass-lo);border-radius:var(--r);padding:18px 20px}
.notecard h3{margin:0 0 6px;font-size:15px}
.notecard p{margin:0;color:var(--ink2);font-size:14px}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:18px}
.modal.open{display:flex}
.modal .mbox{background:var(--glass-menu);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow);border-radius:22px;padding:22px;max-width:400px;width:100%}
.modal .mbox h3{margin:0}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--hair2);font-size:14px}
.kv:last-of-type{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;text-align:right}

/* ============ UI11 · Midnight Premium night theme (same values as UI11) ============ */
html[data-theme="dark"] body{background:linear-gradient(180deg,#0A100C,#060807)}
html[data-theme="dark"] .orb.o1{background:rgba(34,197,94,.14)}
html[data-theme="dark"] .orb.o2{background:rgba(74,222,128,.08)}
html[data-theme="dark"] .orb.o3{background:rgba(34,197,94,.05)}
html[data-theme="dark"]{
  color-scheme:dark;
  --ink:#F4F8F4; --ink2:#B9C8BB; --muted:#8CA08D;
  --bg:#070B09;
  --glass:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
  --glass-brd:rgba(255,255,255,.09);
  --glass-hi:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.04));
  --glass-lo:rgba(255,255,255,.03); --glass-menu:rgba(10,16,12,.92);
  --field-bg:rgba(255,255,255,.055); --field-brd:rgba(255,255,255,.10);
  --keybg:linear-gradient(165deg,rgba(255,255,255,.07),rgba(255,255,255,.03)); --keybrd:rgba(255,255,255,.10);
  --mint-glass:rgba(34,197,94,.16);
  --hair:rgba(255,255,255,.09); --hair2:rgba(255,255,255,.05);
  --gridline:rgba(255,255,255,.08); --track:rgba(255,255,255,.08);
  --shadow:0 18px 40px rgba(0,0,0,.45); --shadow-sm:0 8px 22px rgba(0,0,0,.35);
  --deep:#4ADE80; --exp-red:#F97066;
}
html[data-theme="dark"] .card,html[data-theme="dark"] .stat{
  background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
  border-color:rgba(255,255,255,.09);box-shadow:0 18px 40px rgba(0,0,0,.45)}
html[data-theme="dark"] .sidebar,html[data-theme="dark"] .topbar{
  background:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.04));
  border-color:rgba(255,255,255,.11);box-shadow:0 18px 40px rgba(0,0,0,.45)}
html[data-theme="dark"] .side-nav button.active{background:rgba(34,197,94,.18);color:#4ADE80}
html[data-theme="dark"] .side-nav button.active svg{color:#4ADE80}
html[data-theme="dark"] .side-nav button{color:#B9C8BB}
html[data-theme="dark"] .admin-pill{background:linear-gradient(135deg,#22C55E,#16A34A);color:#fff}
html[data-theme="dark"] .fpill.active{background:linear-gradient(135deg,#22C55E,#16A34A);color:#fff}
html[data-theme="dark"] .pill.on{background:rgba(34,197,94,.18);color:#4ADE80}
html[data-theme="dark"] input::placeholder{color:rgba(244,248,244,.35)}
html[data-theme="dark"] .switch .knob{background:#fff}


/* ============ support (two-pane threads) ============ */
.avatar.sm{width:30px;height:30px;font-size:12px}
.supcard{display:grid;grid-template-columns:320px minmax(0,1fr);
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);

  height:calc(100dvh - 168px);min-height:540px}
.sup-left{border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0;min-width:0}
.sup-list{overflow-y:auto;flex:1;padding:4px 8px 12px;min-height:0}
.sup-thread{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:transparent;
  border:1px solid transparent;border-radius:14px;padding:11px 10px;font-size:14px}
.sup-thread .avatar{width:38px;height:38px;font-size:13px;background:linear-gradient(135deg,var(--mint2),var(--mint));color:var(--deep)}

.sup-thread .st-user{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sup-thread .st-time{margin-left:auto;flex:none;font-size:11.5px;color:var(--muted);white-space:nowrap}

.msgrow{display:flex;gap:9px;align-items:flex-start}

.msgrow.me .attachcard .afile{background:rgba(255,255,255,.2);color:#fff}
.attachcard .an2{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.attachcard .as2{font-size:12px;opacity:.75}
.attachimg{max-width:230px;width:100%;border-radius:12px;margin-bottom:8px}
.sup-composer{border-top:1px solid var(--hair);padding:12px 16px 10px}
.sup-crow{display:flex;align-items:center;gap:10px}
.sup-attach{border-radius:50%}

  padding:11px 16px;font-size:14px;color:var(--ink);outline:none}
.sup-send{flex:none;width:42px;height:42px;border-radius:50%;border:0;color:#fff;

.sup-hint{font-size:12px;color:var(--muted);margin:9px 2px 0}
.sup-back{display:none}
@media (max-width:900px){
  .supcard{grid-template-columns:1fr;height:calc(100dvh - 196px);min-height:480px}

}

}

    {from:'user', days:2, time:'4:41 PM', text:'Here is my payment screenshot.', attach:{name:'payment-receipt.png', size:248000, kind:'image', url:''}}

var state = {page:'overview', lang:'my', theme:'light', txnFilter:'all', thread:0, settings:{reg:true, maint:false, msg:true}};
try {
  var saved = JSON.parse(localStorage.getItem(LSKEY) || 'null');
  if (saved) {
    if (saved.lang) state.lang = saved.lang;
    if (saved.theme) state.theme = saved.theme;
    if (saved.settings) state.settings = saved.settings;
    if (saved.suspended) saved.suspended.forEach(function(u, i){ if (USERS[i]) USERS[i].suspended = u; });
    if (saved.threads && saved.threads.length) THREADS = saved.threads;
    if (typeof saved.thread === 'number' && THREADS[saved.thread]) state.thread = saved.thread;
  }
} catch (e) {}
function save() {
  try {
    var th = JSON.parse(JSON.stringify(THREADS, function(k, v){ return (k === 'url' && typeof v === 'string' && v.indexOf('blob:') === 0) ? '' : v; }));
    localStorage.setItem(LSKEY, JSON.stringify({lang: state.lang, theme: state.theme, settings: state.settings, suspended: USERS.map(function(u){ return u.suspended; }), threads: th, thread: state.thread}));
  } catch (e) {}
}
function t(k) { return (STRINGS[state.lang] && STRINGS[state.lang][k]) || STRINGS.en[k] || k; }
function fmt(n) { return n.toLocaleString('en-US'); }
function fmtSigned(n) { return (n >= 0 ? '+' : '−') + fmt(Math.abs(n)); }
function locale() { return state.lang === 'my' ? 'my-MM' : 'en-US'; }
function dateDays(days) {
  var d = new Date(Date.now() - days * 864e5);
  return new Intl.DateTimeFormat(locale(), {year:'numeric', month:'short', day:'numeric'}).format(d);
}
function initials(name) { return name.split(' ').map(function(w){ return w[0]; }).slice(0, 2).join(''); }
function applyLang() {
  document.documentElement.lang = state.lang === 'my' ? 'my-MM' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    el.textContent = t(el.getAttribute('data-i18n'));
    if (state.lang === 'my') el.classList.add('my'); else el.classList.remove('my');
  });
  document.getElementById('topSearch').placeholder = t('search_ph');
  document.getElementById('userSearch').placeholder = t('users_search_ph');
  document.getElementById('supSearch').placeholder = t('sup_search_ph');
  document.getElementById('langBtnTxt').textContent = state.lang === 'my' ? 'English' : 'မြန်မာ';
  document.getElementById('pageTitle').textContent = t('nav_' + state.page);
  renderAll();
}
function renderChart() {
  var max = Math.max.apply(null, VOLUME);
  var html = '';
  for (var i = 0; i < 6; i++) {
    var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - (5 - i));
    var mon = new Intl.DateTimeFormat(locale(), {month:'short'}).format(d);
    var h = Math.round(VOLUME[i] / max * 62);
    html += '<div class="col"><span class="cv num">' + fmt(VOLUME[i]) + '</span><i style="height:' + h + '%"></i><span class="cm">' + mon + '</span></div>';
  }
  document.getElementById('volChart').innerHTML = html;
}
function renderOverviewLists() {
  var nu = '';
  USERS.slice(0, 5).forEach(function(u) {
    nu += '<div class="urow"><span class="avatar">' + initials(u.name) + '</span><div><div class="un">' + u.name + '</div><div class="uu">@' + u.username + '</div></div><div class="ur"><div class="uu">' + dateDays(u.joinedDays) + '</div></div></div>';
  });
  document.getElementById('newUsers').innerHTML = nu;
  var rt = '';
  TXNS.slice(0, 5).forEach(function(x) {
    rt += '<div class="trow"><span class="avatar">' + initials(x.user) + '</span><div><div class="un" style="font-weight:600;font-size:14px">' + x.user + '</div><div class="tc">' + t(x.cat) + '</div></div><span class="ta num ' + (x.amt >= 0 ? 'green-t' : 'red-t') + '">' + fmtSigned(x.amt) + '</span></div>';
  });
  document.getElementById('recentTxn').innerHTML = rt;
}
function userRow(u, idx) {
  var status = u.suspended
    ? '<span class="pill off">' + t('status_suspended') + '</span>'
    : '<span class="pill on">' + t('status_active') + '</span>';
  var act = u.suspended ? t('act_activate') : t('act_suspend');
  return '<tr><td><div class="ucell"><span class="avatar">' + initials(u.name) + '</span><div><div style="font-weight:600">' + u.name + '</div><div class="muted" style="font-size:12.5px">@' + u.username + '</div></div></div></td>' +
    '<td>' + dateDays(u.joinedDays) + '</td><td class="num">' + u.txns + '</td><td class="num" style="font-weight:700">' + fmt(u.net) + '</td>' +
    '<td>' + status + '</td>' +
    '<td><button class="abtn" data-view="' + idx + '">' + t('act_view') + '</button> <button class="abtn warn" data-toggle="' + idx + '">' + act + '</button></td></tr>';
}
function renderUsers(filter) {
  var q = (filter || '').trim().toLowerCase();
  var html = '', shown = 0;
  USERS.forEach(function(u, i) {
    if (q && u.name.toLowerCase().indexOf(q) < 0 && u.username.toLowerCase().indexOf(q) < 0) return;
    html += userRow(u, i); shown++;
  });
  document.getElementById('usersBody').innerHTML = html;
  document.getElementById('noUsers').style.display = shown ? 'none' : 'block';
}
function renderTxns() {
  var html = '';
  TXNS.forEach(function(x) {
    var kind = x.amt >= 0 ? 'income' : 'expense';
    if (state.txnFilter !== 'all' && state.txnFilter !== kind) return;
    html += '<tr><td>' + dateDays(x.days) + '</td><td style="font-weight:600">' + x.user + '</td><td>' + t(x.cat) + '</td><td class="muted">' + t(x.note) + '</td>' +
      '<td class="num" style="font-weight:700;color:var(--' + (x.amt >= 0 ? 'green' : 'exp-red') + ')">' + fmtSigned(x.amt) + '</td></tr>';
  });
  document.getElementById('txnBody').innerHTML = html;
}
function renderConvs() {
  var html = '';
  CONVS.forEach(function(c) {
    html += '<div class="convrow"><span class="avatar">' + initials(c.a) + '</span><div style="min-width:0"><div class="cn">' + c.a + ' &#8596; ' + c.b + '</div><div class="cs">' + t(c.snip) + '</div></div><span class="ct">' + t(c.time) + '</span></div>';
  });
  document.getElementById('convList').innerHTML = html;
}
function renderSettings() {
  document.querySelectorAll('.switch').forEach(function(sw) {
    var on = !!state.settings[sw.getAttribute('data-set')];
    sw.classList.toggle('on', on);
    sw.setAttribute('aria-checked', on ? 'true' : 'false');
  });
}

var PIN_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5h6V10l2.2 3.2H6.8L9 10z"/><path d="M12 13.2V20.5"/></svg>';
var PIN_SVG_BIG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="PINSTATE" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5h6V10l2.2 3.2H6.8L9 10z"/><path d="M12 13.2V20.5"/></svg>';
var FILE_SVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function shortDate(days) {
  return new Intl.DateTimeFormat(locale(), {month:'short', day:'numeric'}).format(new Date(Date.now() - days * 864e5));
}
function dividerDate(days) {
  return new Intl.DateTimeFormat(locale(), {weekday:'short', month:'short', day:'numeric'}).format(new Date(Date.now() - days * 864e5));
}
function nowTime() { return new Intl.DateTimeFormat('en-US', {hour:'numeric', minute:'2-digit'}).format(new Date()); }
function fmtSize(n) {
  if (!n && n !== 0) return '';
  if (n >= 1048576) return (n / 1048576).toFixed(2) + ' MB';
  if (n >= 1024) return Math.round(n / 1024) + ' KB';
  return n + ' B';
}
function threadLast(th) { return th.msgs[th.msgs.length - 1]; }
function snippetOf(m) { return m.attach ? t('sup_photo') : (m.text || ''); }
function threadTimeLabel(th) {
  var m = threadLast(th);
  return m.days === 0 ? m.time : shortDate(m.days) + ' \u00b7 ' + m.time;
}
function renderThreads() {
  var q = (document.getElementById('supSearch').value || '').trim().toLowerCase();
  var html = '';
  THREADS.forEach(function(th, i) {
    if (q && th.username.toLowerCase().indexOf(q) < 0 && th.name.toLowerCase().indexOf(q) < 0) return;
    var pin = PIN_SVG_BIG.replace('PINSTATE', th.pinned ? 'currentColor' : 'none');
    html += '<button class="sup-thread' + (i === state.thread ? ' sel' : '') + '" data-thread="' + i + '">' +
      '<span class="avatar">' + initials(th.name) + '</span>' +
      '<span class="st-main"><span class="st-top"><span class="st-user">' + esc(th.username) + '</span>' +
      '<span class="st-time">' + threadTimeLabel(th) + '</span></span>' +
      '<span class="st-snip" style="display:block">' + esc(snippetOf(threadLast(th))) + '</span></span>' +
      '<span class="st-pin' + (th.pinned ? ' on' : '') + '">' + pin + '</span></button>';
  });
  document.getElementById('supList').innerHTML = html;
}
function attachHTML(m) {
  var a = m.attach, inner = '';
  if (a.url) inner += '<img class="attachimg" src="' + a.url + '" alt="">';
  inner += '<span class="attachcard"><span class="afile">' + FILE_SVG + '</span><span><span class="an2">' + esc(a.name) + '</span>' +
    (a.size ? '<br><span class="as2">' + fmtSize(a.size) + '</span>' : '') + '</span></span>';
  return inner;
}
function msgHTML(m, idx, th) {
  var body = m.attach ? ((m.text ? '<div style="margin-bottom:8px">' + esc(m.text) + '</div>' : '') + attachHTML(m)) : esc(m.text || '');
  var pinBtn = '<button class="pinbtn' + (m.pinned ? ' on' : '') + '" data-pin="' + idx + '">' + PIN_SVG + '<span>' + t('sup_pin') + '</span></button>';
  if (m.from === 'admin') {
    return '<div class="msgrow me"><div class="msgcol"><div class="bub' + (m.pinned ? ' pinned' : '') + '">' + body + '</div>' +
      '<div class="msgmeta"><span>&#10003; ' + t('sup_admin') + ' \u00b7 ' + m.time + '</span>' + pinBtn + '</div></div></div>';
  }
  return '<div class="msgrow them"><span class="avatar sm">' + initials(th.name) + '</span><div class="msgcol"><div class="bub' + (m.pinned ? ' pinned' : '') + '">' + body + '</div>' +
    '<div class="msgmeta"><span>' + esc(th.username) + ' \u00b7 ' + m.time + '</span>' + pinBtn + '</div></div></div>';
}
var supScrollWanted = true;
function renderConv() {
  var th = THREADS[state.thread];
  document.getElementById('supAvatar').textContent = initials(th.name);
  document.getElementById('supUser').textContent = th.username;
  document.getElementById('supInput').placeholder = t('sup_reply_ph').replace('{u}', th.username);
  var box = document.getElementById('supMsgs');
  var keep = box.scrollTop;
  var html = '', lastDay = null;
  th.msgs.forEach(function(m, i) {
    if (m.days !== lastDay) { html += '<div class="sup-divider">' + dividerDate(m.days) + '</div>'; lastDay = m.days; }
    html += msgHTML(m, i, th);
  });
  box.innerHTML = html;
  if (supScrollWanted) { box.scrollTop = box.scrollHeight; supScrollWanted = false; }
  else box.scrollTop = keep;
}
function selectThread(i) {
  state.thread = i; supScrollWanted = true;
  document.getElementById('supCard').classList.add('show-conv');
  renderThreads(); renderConv(); save();
}
function sendReply() {
  var inp = document.getElementById('supInput');
  var v = inp.value.trim(); if (!v) return;
  THREADS[state.thread].msgs.push({from:'admin', days:0, time:nowTime(), text:v});
  inp.value = '';
  supScrollWanted = true;
  save(); renderThreads(); renderConv();
}
function renderAll() { renderChart(); renderOverviewLists(); renderUsers(document.getElementById('userSearch').value); renderTxns(); renderConvs(); renderSettings(); renderThreads(); renderConv(); }
function go(page) {
  state.page = page;
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('#sideNav button').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-page') === page); });
  document.getElementById('pageTitle').textContent = t('nav_' + page);
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.style.colorScheme = state.theme;
  document.getElementById('icoMoon').style.display = state.theme === 'dark' ? 'none' : 'block';
  document.getElementById('icoSun').style.display = state.theme === 'dark' ? 'block' : 'none';
}
document.querySelectorAll('#sideNav button').forEach(function(b) {
  b.addEventListener('click', function() { go(b.getAttribute('data-page')); });
});
document.getElementById('themeBtn').addEventListener('click', function() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark'; applyTheme(); save();
});
document.getElementById('langBtn').addEventListener('click', function() {
  state.lang = state.lang === 'my' ? 'en' : 'my'; applyLang(); save();
});
document.getElementById('userSearch').addEventListener('input', function(e) { renderUsers(e.target.value); });
document.getElementById('topSearch').addEventListener('input', function(e) {
  var v = e.target.value;
  document.getElementById('userSearch').value = v;
  if (state.page !== 'users') go('users');
  renderUsers(v);
});
document.getElementById('txnPills').addEventListener('click', function(e) {
  var b = e.target.closest('[data-filter]'); if (!b) return;
  state.txnFilter = b.getAttribute('data-filter');
  document.querySelectorAll('#txnPills .fpill').forEach(function(p) { p.classList.toggle('active', p === b); });
  renderTxns();
});
document.getElementById('usersBody').addEventListener('click', function(e) {
  var vb = e.target.closest('[data-view]');
  var tb = e.target.closest('[data-toggle]');
  if (vb) {
    var u = USERS[+vb.getAttribute('data-view')];
    document.getElementById('mAvatar').textContent = initials(u.name);
    document.getElementById('mName').textContent = u.name;
    document.getElementById('mUser').textContent = '@' + u.username;
    document.getElementById('mJoined').textContent = dateDays(u.joinedDays);
    document.getElementById('mTxns').textContent = u.txns;
    document.getElementById('mNet').textContent = fmt(u.net);
    document.getElementById('mStatus').textContent = u.suspended ? t('status_suspended') : t('status_active');
    document.getElementById('userModal').classList.add('open');
  }
  if (tb) {
    var i = +tb.getAttribute('data-toggle');
    USERS[i].suspended = !USERS[i].suspended;
    save(); renderUsers(document.getElementById('userSearch').value);
  }
});
document.getElementById('mClose').addEventListener('click', function() { document.getElementById('userModal').classList.remove('open'); });
document.getElementById('userModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('open'); });
document.querySelectorAll('.switch').forEach(function(sw) {
  sw.addEventListener('click', function() {
    var k = sw.getAttribute('data-set');
    state.settings[k] = !state.settings[k];
    save(); renderSettings();
  });
});

document.getElementById('supList').addEventListener('click', function(e) {
  var b = e.target.closest('[data-thread]'); if (!b) return;
  selectThread(+b.getAttribute('data-thread'));
});
document.getElementById('supSearch').addEventListener('input', function() { renderThreads(); });
document.getElementById('supSend').addEventListener('click', sendReply);
document.getElementById('supInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') sendReply(); });
document.getElementById('supMsgs').addEventListener('click', function(e) {
  var b = e.target.closest('[data-pin]'); if (!b) return;
  var m = THREADS[state.thread].msgs[+b.getAttribute('data-pin')];
  m.pinned = !m.pinned;
  save(); renderConv();
});
document.getElementById('supFile').addEventListener('change', function(e) {
  var f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  var isImg = (f.type || '').indexOf('image/') === 0;
  THREADS[state.thread].msgs.push({from:'admin', days:0, time:nowTime(), text:'', attach:{name:f.name, size:f.size, kind:isImg ? 'image' : 'file', url:isImg ? URL.createObjectURL(f) : ''}});
  supScrollWanted = true;
  save(); renderThreads(); renderConv();
});
document.getElementById('supBack').addEventListener('click', function() {
  document.getElementById('supCard').classList.remove('show-conv');
});
applyTheme();
applyLang();
go('overview');
</script>
