<!DOCTYPE html>
<html lang="{{ 'my-MM' if lang=='my' else 'en' }}" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Ngwe Chay Yar — Admin</title>
<link rel="icon" href="/static/img/logo-256.png">
<style>
/* Always-dark auth design (black / white / green only) — same design
   language as the app's login page. */
:root{--green:#22C55E;--green2:#16A34A;
  --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"Noto Sans Myanmar","Pyidaungsu",sans-serif;
  --myfont:"Noto Sans Myanmar","Pyidaungsu",-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box} html{color-scheme:dark}
body{margin:0;min-height:100dvh;font-family:var(--font);background:#050807;color:#fff;
  display:flex;align-items:center;justify-content:center;padding:22px;position:relative;overflow:hidden}
{% if lang=='my' %}body{font-family:var(--myfont)}{% endif %}
body::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(620px 340px at 18% 8%,rgba(34,197,94,.22),transparent 65%),
             radial-gradient(700px 380px at 88% 88%,rgba(22,163,74,.16),transparent 65%),
             radial-gradient(420px 240px at 78% 12%,rgba(74,222,128,.10),transparent 60%)}
.card{position:relative;width:100%;max-width:400px;background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:30px 26px 26px;
  -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 24px 60px rgba(0,0,0,.55)}
@media(min-width:1024px){.card{max-width:430px;padding:38px 36px 32px}}
.logo-tile{width:64px;height:64px;border-radius:18px;background:#111;overflow:hidden;margin:0 auto 14px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.logo-tile img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin:0;text-align:center;font-size:23px;font-weight:800}
.tag{text-align:center;color:var(--green);font-size:10.5px;letter-spacing:.16em;font-weight:700;margin-top:4px}
.note{text-align:center;color:rgba(255,255,255,.62);font-size:13.5px;margin:14px 0 20px;line-height:1.6}
label{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,.85);margin:14px 0 7px}
input{width:100%;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);color:#fff;
  border-radius:999px;padding:13px 18px;font-size:15px;outline:none;font-family:inherit}
input:focus{border-color:var(--green)}
input::placeholder{color:rgba(255,255,255,.35)}
.err{background:rgba(217,45,32,.16);border:1px solid rgba(249,112,102,.5);color:#FECDC2;
  border-radius:14px;padding:11px 15px;font-size:13.5px;margin-bottom:6px}
button[type=submit]{width:100%;margin-top:22px;border:0;border-radius:999px;padding:14px;
  background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;font-size:15.5px;font-weight:800;
  cursor:pointer;font-family:inherit;box-shadow:0 10px 26px rgba(34,197,94,.35)}
.links{display:flex;justify-content:space-between;margin-top:18px;font-size:13.5px}
.links a{color:var(--green);text-decoration:none;font-weight:600}
.pill-admin{display:inline-block;font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;
  background:rgba(34,197,94,.18);color:#4ADE80;border:1px solid rgba(74,222,128,.4)}
</style>
</head>
<body>
<div class="card">
  <div class="logo-tile"><img src="/static/img/logo-256.png" alt="Ngwe Chay Yar logo"></div>
  <h1>Ngwe Chay Yar</h1>
  <div class="tag">FOOT OF MONEY</div>
  <p class="note"><span class="pill-admin">Admin</span><br>{{ s.admin_login_note }}</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('admin_login') }}">
    <label for="email">{{ s.email }}</label>
    <input id="email" name="email" type="email" required autocomplete="username" placeholder="{{ s.email }}">
    <label for="password">{{ s.password }}</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="{{ s.password }}">
    <button type="submit">{{ s.sign_in }}</button>
  </form>
  <div class="links">
    <a href="/">{{ s.back_to_app }}</a>
    <a href="{{ url_for('admin_login', lang=('en' if lang=='my' else 'my')) }}">{{ 'English' if lang=='my' else 'မြန်မာ' }}</a>
  </div>
</div>
</body>
</html>
