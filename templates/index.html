<!DOCTYPE html>
<html lang="my-MM" style="color-scheme: light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ngwe Chay Yar</title>
<meta name="theme-color" content="#F4F7F4">
<link rel="icon" href="/static/img/logo-256.png">
<style>
/* ============ Ngwe Chay Yar — UI3 Glass design system ============ */
:root{
  --ink:#101410; --ink2:#2A332A; --muted:#5F6B5F;
  --green:#16A34A; --green-b:#22C55E; --green-xl:#4ADE80; --mint:#DCFCE7; --mint2:#BBF7D0;
  --deep:#14532D; --deep2:#0B3D24; --exp-red:#D92D20;
  --hair:rgba(16,20,16,.07); --hair2:rgba(16,20,16,.05);
  --glass:rgba(255,255,255,.58);
  --glass-brd:rgba(255,255,255,.75);
  --shadow:0 12px 40px rgba(11,61,36,.10);
  --shadow-sm:0 4px 18px rgba(11,61,36,.07);
  --r:20px;
  --bg:var(--bg); --glass-hi:rgba(255,255,255,.62); --glass-lo:rgba(255,255,255,.48); --glass-menu:var(--glass-menu);
  --field-bg:var(--field-bg); --field-brd:var(--field-brd); --keybg:var(--keybg); --keybrd:var(--keybrd);
  --mint-glass:var(--mint-glass); --gridline:rgba(16,20,16,.05); --track:var(--track);
  --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"Noto Sans Myanmar","Pyidaungsu",sans-serif;
  --myfont:"Noto Sans Myanmar","Pyidaungsu",-apple-system,"Segoe UI",Roboto,sans-serif;
}
html{color-scheme:light}
html[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
/* living background orbs (fixed, blurred) */
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.orb.o1{width:520px;height:520px;background:rgba(20,83,45,.20);top:-180px;right:-120px}
.orb.o2{width:460px;height:460px;background:rgba(34,197,94,.16);bottom:-160px;left:-140px}
.orb.o3{width:380px;height:380px;background:rgba(95,107,95,.14);top:38%;left:44%}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit}
img{display:block}
.num,.sv,.wv,.ta,.big,.amt,.dv,b,strong{font-variant-numeric:tabular-nums}
/* Myanmar text rules */
.my{font-family:var(--myfont);letter-spacing:0!important;text-transform:none!important;line-height:1.9;overflow-wrap:normal;white-space:normal}
.my-sub{display:block;font-family:var(--myfont);font-size:12.5px;color:var(--muted);letter-spacing:0!important;text-transform:none!important;line-height:1.9;margin-top:2px}
/* labels: English-only small caps */
.lbl,.sl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.green-t{color:var(--green)}

/* ============ layout ============ */
.layout{position:relative;z-index:1}
.center{max-width:480px;margin:0 auto;padding:14px 16px 128px}
.sidebar,.rightpanel{display:none}

/* ============ floating glass top bar (mobile) ============ */
.mobiletop{position:sticky;top:12px;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--glass-hi);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--hair2);border-radius:18px;padding:10px 12px}
.brandrow{display:flex;align-items:center;gap:11px;min-width:0}
.logo-tile{flex:none;width:42px;height:42px;border-radius:12px;background:#111111;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.logo-tile img{width:100%;height:100%;object-fit:cover}
.logo-tile.lg{width:54px;height:54px;border-radius:14px}
.brandname{font-weight:650;font-size:16px;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
.brandsub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:700}
.iconbtns{display:flex;gap:8px}
.icobtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--hair);background:var(--field-bg);display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:transform .2s,box-shadow .2s}
.icobtn svg{width:19px;height:19px}
.icobtn:active{transform:scale(.96)}

/* ============ desktop head ============ */
.deskhead{display:none}

/* ============ flash ============ */




.flash{display:none;margin-top:12px;background:rgba(9,14,10,.92);color:#fff;border-radius:14px;padding:11px 16px;font-size:13.5px;line-height:1.8;letter-spacing:0;box-shadow:var(--shadow)}
  #bootload{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:#F4F7F4}
  html[data-theme="dark"] #bootload{background:#07130C}
  .pavatar{position:relative;overflow:hidden}
  .pavatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* ============ pages ============ */
.page{display:none}
.page.active{display:block;animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page.active{animation:none}*{transition:none!important}}

/* ============ glass card ============ */
.card{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow),inset 0 0 0 1px var(--hair2);border-radius:var(--r);padding:18px;margin-bottom:14px}
.listcard{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow),inset 0 0 0 1px var(--hair2);border-radius:var(--r);padding:4px 16px;margin-bottom:14px}
.sechead{margin:22px 2px 10px}
.sechead h2{display:inline;font-size:17px;font-weight:650;letter-spacing:-.015em}
.rowbet{display:flex;align-items:center;justify-content:space-between;gap:10px}
.linkbtn{background:none;border:none;color:var(--green);font-size:13px;font-weight:600;padding:4px 2px}

/* ============ home ============ */
.dateline{margin:18px 2px 10px;font-size:13px;color:var(--muted)}
.dateline b{color:var(--ink2);font-weight:600}
.spendcard{margin-bottom:14px}
.spend-top{display:flex;align-items:center;gap:10px}
.spend-ico{width:34px;height:34px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(217,45,32,.10);color:var(--exp-red)}
.spend-ico svg{width:19px;height:19px}
.spend-chip{margin-left:auto;flex:none;font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--glass-lo);border:1px solid var(--hair);border-radius:999px;padding:4px 11px;font-variant-numeric:tabular-nums}
.spendcard .amt{font-size:29px;font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:10px 0 6px;font-variant-numeric:tabular-nums;color:var(--exp-red)}
.spendcard .vs{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
:lang(my) .spendcard .vs{line-height:1.7}
.vsdiff{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.vsdiff svg{width:11px;height:11px;flex:none}
.vsdiff.up{color:var(--exp-red)}
.vsdiff.down{color:var(--green)}
.spend-track{height:5px;border-radius:99px;background:rgba(16,20,16,.06);margin-top:12px;overflow:hidden}
.spend-fill{height:100%;border-radius:99px;background:var(--exp-red);transition:width .5s ease}
html[data-theme="dark"] .spend-ico{background:rgba(249,112,102,.13)}
html[data-theme="dark"] .spend-track{background:var(--track)}
.hero{background:linear-gradient(135deg,rgba(9,14,10,.92),rgba(11,61,36,.88));-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 44px rgba(9,14,10,.22);border-radius:var(--r);padding:18px;color:#fff;margin-bottom:14px}
.hero .lbl{color:var(--field-bg)}
.hero .big{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero-grid{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:10px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.hero-grid>div{padding:0 10px;min-width:0}
.hero-grid>div:first-child{padding-left:0}
.hero-grid>div:last-child{padding-right:0}
.hero-grid>div+div{border-left:1px solid rgba(255,255,255,.12)}
.hero-grid span{display:block;font-size:11px;color:var(--field-bg);margin-bottom:2px}
.hero-grid b{font-size:14px;font-weight:650;color:#fff;font-variant-numeric:tabular-nums}
.hero-grid b.neg{color:#fff}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px}
.stat{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--hair2);border-radius:var(--r);padding:15px 16px}
.stat .sv{font-size:18.5px;font-weight:650;letter-spacing:-.01em;margin-top:5px}
.stat .sv.g{color:var(--green)}

/* icon chip + hairline rows */
.chip-ico{flex:none;width:36px;height:36px;border-radius:50%;background:rgba(34,197,94,.10);color:var(--deep);display:flex;align-items:center;justify-content:center}
.chip-ico svg{width:19px;height:19px}
.chip-ico.dk{background:#111111;color:var(--green-xl)}
.txn,.wrow,.mgrrow,.toprow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair)}
.txn:last-child,.wrow:last-child,.mgrrow:last-child,.toprow:last-child{border-bottom:none}
.tm{flex:1;min-width:0}
.tn{font-size:14px;font-weight:550;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td{font-size:12px;color:var(--muted);margin-top:1px}
.ta{font-size:14px;font-weight:600;white-space:nowrap}
.ta.income{color:var(--green)}
.ta.expense{color:var(--exp-red)}
.wv{font-size:14.5px;font-weight:650;white-space:nowrap}
.wrow.total .tn{font-weight:650}
.mgrrow b{font-size:14px}
.mgrrow .tm b{font-size:14px;font-weight:600}
.mgrrow small{color:var(--muted);font-size:12px;font-weight:400}
.delbtn{flex:none;width:27px;height:27px;border-radius:50%;border:1px solid var(--hair);background:var(--keybg);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.delbtn svg{width:12px;height:12px}
.delbtn:active{transform:scale(.94)}

/* top spending bars */
.pbar{height:5px;background:rgba(16,20,16,.06);border-radius:999px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green-b),var(--green))}

/* donut */
.donutwrap{position:relative;width:190px;height:190px;margin:6px auto 4px}
.donutwrap svg{width:190px;height:190px}
.donut-centre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 34px}
.donut-centre .dl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;line-height:1.5}
.donut-centre .dv{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dayhead{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin:18px 2px 8px;text-transform:uppercase}

/* analytics bars */
.bars{display:flex;align-items:flex-end;height:180px;gap:8px;padding-top:14px;border-bottom:1px solid var(--hair);
  background:repeating-linear-gradient(to top,transparent 0,transparent 44px,var(--gridline) 44px,var(--gridline) 45px)}
.bcol{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}
.bpair{display:flex;align-items:flex-end;gap:4px;height:100%}
.bpair i{display:block;width:16px;border-radius:6px 6px 2px 2px}
.bpair i.inc{background:linear-gradient(180deg,var(--green-b),var(--deep))}
.bpair i.exp{background:var(--exp-red)}
.blab{font-size:11px;color:var(--muted);padding-top:7px}
.legend-dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.sumcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sumcard{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-brd);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--hair2);border-radius:var(--r);padding:15px 16px}
.sumcard .sv{font-size:18.5px;font-weight:650;margin-top:5px}
.sumcard.inc .sv{color:var(--green)}
.totalhead{font-size:15px;font-weight:650;letter-spacing:-.01em;margin-bottom:4px}

/* ============ forms / buttons ============ */
.field{margin:13px 0}
.field label{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;background:var(--field-bg);border:1px solid var(--field-brd);border-radius:12px;padding:11px 13px;font-size:14.5px;color:var(--ink);outline:none;transition:box-shadow .2s,border-color .2s}
.field input:focus,.field select:focus{border-color:rgba(34,197,94,.5);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:999px;padding:11px 20px;font-size:13.5px;font-weight:600;letter-spacing:.01em;transition:transform .15s,box-shadow .2s}
.btn.primary{background:#111111;color:#fff;box-shadow:0 8px 22px rgba(9,14,10,.18)}
.btn.green{background:var(--green);color:#fff}
.btn.glassb{background:var(--field-bg);border:1px solid var(--hair);color:var(--ink)}
.btn:active{transform:scale(.98)}
.addform{border-top:1px solid var(--hair);margin-top:14px;padding-top:6px}
.addform h3{font-size:14px;font-weight:650;margin:12px 0 2px}

/* ============ add / keypad ============ */
.toggle{display:flex;background:var(--keybg);border:1px solid var(--hair);border-radius:999px;padding:4px;gap:4px}
.toggle button{flex:1;border:none;background:transparent;border-radius:999px;padding:9px 0;font-size:13.5px;font-weight:600;color:var(--muted);transition:all .2s}
.toggle button.on{background:#111111;color:#fff;box-shadow:0 4px 14px rgba(9,14,10,.18)}
.toggle #tg-income.on{background:var(--green);box-shadow:0 4px 14px rgba(22,163,74,.28)}
.amountbig{text-align:center;font-size:32px;font-weight:700;letter-spacing:-.01em;margin:20px 0 0;font-variant-numeric:tabular-nums}
.amountsub{text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:3px}

.chip{border:1px solid var(--hair);background:var(--glass-lo);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:550;transition:all .15s}
.chip.on{background:#111111;color:#fff;border-color:#111111}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.catcell{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 2px 10px;border-radius:16px;border:1px solid var(--hair2);background:var(--glass-lo);font-size:11.5px;font-weight:550;color:var(--ink2);transition:all .15s}
.catcell .chip-ico{width:38px;height:38px}
.catcell.on{border-color:rgba(34,197,94,.55);background:var(--mint-glass);box-shadow:0 0 0 1px rgba(34,197,94,.25)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,clamp(56px,9dvh,66px));column-gap:8px;row-gap:6px;width:100%;max-width:340px;margin:16px auto 0;justify-items:center;align-items:center}
.keypad button{background:var(--keybg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--keybrd);box-shadow:inset 0 0 0 1px var(--hair2),inset 0 1px 0 rgba(255,255,255,.14),var(--shadow-sm);border-radius:50%;width:clamp(56px,9dvh,66px);height:clamp(56px,9dvh,66px);padding:0;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;transition:transform .1s,background .15s}
@media (hover:hover) and (pointer:fine){.keypad button:hover{background:var(--glass-hi)}}
.keypad button:active{transform:scale(.93);background:var(--mint-glass)}
.keypad button.kp-fn{font-size:15px;color:var(--muted)}
.savebtn{width:100%;margin-top:16px;background:#111111;color:#fff;border:none;border-radius:999px;padding:14px 0;font-size:14px;font-weight:600;box-shadow:0 10px 26px rgba(9,14,10,.20);transition:transform .15s}
.savebtn:active{transform:scale(.99)}

/* ============ account ============ */
.profhead{display:flex;align-items:center;gap:13px}
.avatar{flex:none;width:47px;height:47px;border-radius:50%;background:linear-gradient(135deg,var(--deep),var(--green));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:650;overflow:hidden;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.photorow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.photorow .btn{display:inline-flex;align-items:center;gap:7px}
.photorow .btn svg{width:16px;height:16px}
.editbtn{margin-left:auto;background:var(--field-bg);border:1px solid var(--hair);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600}
.menu{padding:4px 16px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--hair);padding:13px 0;font-size:14px;font-weight:550;text-align:left}
.menu button:last-child{border-bottom:none}
.menu .arr{margin-left:auto;color:var(--muted);display:flex}
.menu .arr svg{width:16px;height:16px}

/* ============ floating glass bottom nav ============ */
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(448px,calc(100% - 28px));z-index:70;
  background:var(--glass-hi);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-brd);box-shadow:0 16px 40px rgba(11,61,36,.16),inset 0 0 0 1px var(--hair2);border-radius:999px}
.bn-in{display:flex;align-items:flex-end;justify-content:space-around;padding:8px 10px}
.bn-in>button[data-nav]{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:3px 8px;min-width:56px}
.bn-in>button[data-nav] svg{width:21px;height:21px}
.bn-in>button[data-nav].active{color:var(--green)}
.plusbtn{flex:none;width:52px;height:52px;border-radius:50%;background:#111111;color:#fff;border:2px solid rgba(34,197,94,.55);box-shadow:0 10px 24px rgba(9,14,10,.28),0 0 0 4px var(--glass-hi);display:flex;align-items:center;justify-content:center;transform:translateY(-13px);transition:transform .15s}
.plusbtn svg{width:22px;height:22px}
.plusbtn:active{transform:translateY(-13px) scale(.96)}

/* ============ desktop ============ */
@media (min-width:1024px){
  .orb.o1{width:640px;height:640px;background:rgba(20,83,45,.24)}
  .orb.o2{width:560px;height:560px}
  body{background:linear-gradient(120deg,var(--bg) 55%,var(--mint-glass) 82%,rgba(11,61,36,.10))}
  .layout{display:grid;grid-template-columns:264px minmax(0,1fr) 322px;gap:24px;max-width:1460px;margin:0 auto;padding:24px;align-items:start}
  .mobiletop,.bottomnav{display:none}
  .center{max-width:780px;width:100%;margin:0 auto;padding:0 0 40px}
  .sidebar{display:flex;flex-direction:column;gap:6px;position:sticky;top:24px;height:calc(100vh - 48px);
    background:var(--field-bg);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--glass-brd);border-right:1px solid var(--glass-brd);box-shadow:var(--shadow),inset 0 0 0 1px var(--hair2);border-radius:var(--r);padding:20px 16px}
  .side-nav{display:flex;flex-direction:column;gap:2px;margin-top:20px}
  .side-nav button,.side-foot button{display:flex;align-items:center;gap:11px;background:none;border:none;border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:550;color:var(--ink2);text-align:left;transition:background .15s}
  .side-nav button svg,.side-foot button svg{width:19px;height:19px;color:var(--muted)}
  .side-nav button:hover,.side-foot button:hover{background:var(--glass-hi)}
  .side-nav button.active{background:var(--mint-glass);color:var(--deep)}
  .side-nav button.active svg{color:var(--green)}

/* ============ UI5 i18n / language system ============ */
/* Uppercase tracked labels: ENGLISH ONLY */
.lbl,.sl,.field label,.dayhead,.donut-centre .dl,.amountsub{letter-spacing:0!important;text-transform:none!important;line-height:1.75}
body.lang-en .lbl,body.lang-en .sl,body.lang-en .field label,body.lang-en .amountsub{letter-spacing:.08em!important;text-transform:uppercase!important;line-height:1.5}
body.lang-en .dayhead{letter-spacing:.04em!important;text-transform:uppercase!important}
body.lang-en .donut-centre .dl{letter-spacing:.08em!important;text-transform:uppercase!important}

/* Myanmar: Myanmar font first, tall leading, no tracking */
body.lang-my{font-family:"Noto Sans Myanmar","Pyidaungsu",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif}
body.lang-my .lbl,body.lang-my .sl,body.lang-my .field label,body.lang-my .dayhead,body.lang-my .donut-centre .dl,body.lang-my .amountsub,body.lang-my .sechead h2,body.lang-my .totalhead,body.lang-my .addform h3{font-family:"Noto Sans Myanmar","Pyidaungsu",sans-serif;letter-spacing:0!important;line-height:1.9}

body.lang-th .lbl,body.lang-th .sl,body.lang-th .field label,body.lang-th .dayhead,body.lang-th .donut-centre .dl,body.lang-th .amountsub,body.lang-th .sechead h2,body.lang-th .totalhead,body.lang-th .addform h3{letter-spacing:0!important;line-height:1.8}

/* ============ UI8 Dark Mode (CSS variables flip) ============ */
html[data-theme="dark"]{
  color-scheme:dark;
  --ink:#F2F5F2; --ink2:#D7E0D7; --muted:#9DB09D;
  --bg:#0A0E0A;
  --glass:rgba(22,30,22,.55); --glass-brd:rgba(255,255,255,.09);
  --glass-hi:rgba(28,38,28,.62); --glass-lo:rgba(24,32,24,.50); --glass-menu:rgba(18,26,18,.88);
  --field-bg:rgba(28,38,28,.55); --field-brd:rgba(255,255,255,.12);
  --keybg:rgba(28,38,28,.50); --keybrd:rgba(255,255,255,.10);
  --mint-glass:rgba(22,163,74,.20);
  --hair:rgba(255,255,255,.08); --hair2:rgba(255,255,255,.05);
  --gridline:rgba(255,255,255,.07); --track:rgba(255,255,255,.13);
  --shadow:0 12px 40px rgba(0,0,0,.45); --shadow-sm:0 4px 18px rgba(0,0,0,.35);
  --deep:#4ADE80; --exp-red:#F97066;
}
html[data-theme="dark"] .orb.o1{background:rgba(20,83,45,.13)}
html[data-theme="dark"] .orb.o2{background:rgba(34,197,94,.10)}

html[data-theme="dark"] .msg-openbtn,html[data-theme="dark"] .composer .sendbtn{
  background:var(--green);color:#fff;box-shadow:0 8px 22px rgba(22,163,74,.32)}

  background:var(--green);border-color:var(--green);color:#fff}

/* Settings theme switch */
.switch{flex:none;width:50px;height:29px;border-radius:999px;border:1px solid var(--hair);background:var(--glass-lo);position:relative;transition:background .2s;padding:0;cursor:pointer}
.switch .knob{position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:left .2s}
.switch.on{background:var(--green);border-color:var(--green)}
.switch.on .knob{left:23px}

function totals(){
  var accounts = state.accounts.reduce(function(a,r){ return a+Number(r.balance||0); },0);
  var assets = state.assets.reduce(function(a,r){ return a+Number(r.current_value||0); },0);
  var debts = state.debts.reduce(function(a,r){ return a+Number(r.amount||0); },0);
  var mt = monthTotals(monthPrefix());
  return {accounts:accounts, assets:assets, debts:debts,
    netWorth: accounts + assets - debts,
    income:mt.income, expense:mt.expense, leftover:mt.income-mt.expense};
}
function monthTotals(prefix){
  var inc=0, exp=0;
  state.transactions.forEach(function(r){ if((r.txn_date||'').slice(0,7)===prefix){ if(r.kind==='income') inc+=Number(r.amount||0); else exp+=Number(r.amount||0); } });
  return {income:inc, expense:exp, leftover:inc-exp};
}
function expenseByCategory(prefix){
  var by={};
  state.transactions.forEach(function(r){ if(r.kind==='expense' && (r.txn_date||'').slice(0,7)===prefix){ by[r.category]=(by[r.category]||0)+Number(r.amount||0); } });
  return Object.keys(by).map(function(k){ return {cat:k, amount:by[k]}; }).sort(function(a,b){ return b.amount-a.amount; });
}
function nextPrefix(p){ var a=p.split('-'), y=+a[0], m=+a[1]+1; if(m===13){m=1;y++;} return y+'-'+String(m).padStart(2,'0'); }

function flash(msg){
  var f=el('flash'); f.textContent=msg; f.style.display='block';
  setTimeout(function(){ f.style.display='none'; }, 2600);

}

function delItem(kind, id){
  if(!confirm(t('delete_confirm'))) return;
  var arr = state[kind] || [];
  var removed = null;
  for(var i=0;i<arr.length;i++){ if(arr[i].id===id){ removed = arr[i]; arr.splice(i,1); break; } }
  /* Deleting a transaction reverses its effect on the linked wallet
     (balances are computed, so this mirrors the server exactly). */
  if(kind==='transactions' && removed && removed.account_id){
    applyWalletDelta(removed.account_id, removed.kind==='income' ? -Number(removed.amount||0) : Number(removed.amount||0));
  }
  renderAll(); flash(t('deleted'));
  apiFetch('DELETE', '/api/'+kind+'/'+id).catch(function(e){ apiFail(e); });
}
function walletNameById(id){
  if(id===null || id===undefined) return '';
  for(var i=0;i<state.accounts.length;i++){ if(state.accounts[i].id===id) return state.accounts[i].name; }
  return '';
}
function applyWalletDelta(accountId, delta){
  if(!accountId || !delta) return;
  for(var i=0;i<state.accounts.length;i++){
    if(state.accounts[i].id===accountId){ state.accounts[i].balance = Number(state.accounts[i].balance||0) + delta; return; }
  }
}
function delBtn(kind, id){ return '<button class="delbtn" title="'+esc(t('delete_label'))+'" aria-label="'+esc(t('delete_label'))+'" onclick="delItem(\''+kind+'\','+id+')">'+svgI('<path d="M6 6l12 12M18 6L6 18"/>')+'</button>'; }
function txnRow(r, withDel){
  var wname = walletNameById(r.account_id);

    '<span class="tm"><span class="tn">'+esc(catLabel(r.category))+(r.note?' · '+esc(r.note):'')+'</span><div class="td">'+esc(fmtDateISO(r.txn_date))+(wname?' · '+esc(wname):'')+'</div></span>'+
    '<span class="ta '+r.kind+'">'+(r.kind==='income'?'+':'−')+mmk(r.amount)+'</span>'+(withDel?delBtn('transactions', r.id):'')+'</div>';
}
function sortedTxns(){
  return state.transactions.slice().sort(function(a,b){ return (b.txn_date||'').localeCompare(a.txn_date||'') || b.id-a.id; });
}

function renderActivity(){
  var tt = totals();
  var prefix = monthPrefix();
  /* summary strip — this month */
  el('s-income').textContent = mmk(tt.income);
  el('s-expense').textContent = mmk(tt.expense);
  el('s-leftover').textContent = mmk(tt.leftover);
  /* monthly analytics bars — last 6 months */
  var months=[], p=prefix;
  for(var i=0;i<5;i++) p=prevPrefix(p);
  for(var j=0;j<6;j++){ var mt=monthTotals(p); months.push({prefix:p, income:mt.income, expense:mt.expense}); p=nextPrefix(p); }
  var max=0; months.forEach(function(m){ max=Math.max(max, m.income, m.expense); });
  el('a-bars').innerHTML = months.map(function(m){
    var ih = max? Math.max(m.income/max*100, m.income?7:0):0, eh = max? Math.max(m.expense/max*100, m.expense?7:0):0;
    return '<div class="bcol"><div class="bpair"><i class="inc" style="height:'+ih.toFixed(1)+'%"></i><i class="exp" style="height:'+eh.toFixed(1)+'%"></i></div></div>';
  }).join('');
  el('a-barlabs').innerHTML = months.map(function(m){ return '<div style="flex:1;text-align:center" class="blab">'+esc(monthShort(m.prefix))+'</div>'; }).join('');
  /* income + expense cycle donut — shares of this month's total flow */
  var flow = tt.income + tt.expense;
  var incFrac = flow ? tt.income/flow : 0, expFrac = flow ? tt.expense/flow : 0;
  el('c-centre').textContent = mmk(tt.leftover);
  var EXP_RED = theme()==='dark' ? '#F97066' : '#D92D20';
  var INC = theme()==='dark' ? '#4ADE80' : '#16A34A';
  var C = 2*Math.PI*52, csvg='';
  if(flow>0){
    var incLen = Math.max(incFrac*C - 2.5, 0), expLen = Math.max(expFrac*C - 2.5, 0);
    csvg += '<circle cx="60" cy="60" r="52" fill="none" stroke="'+INC+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+incLen+' '+(C-incLen)+'" stroke-dashoffset="0" transform="rotate(-90 60 60)"></circle>';
    csvg += '<circle cx="60" cy="60" r="52" fill="none" stroke="'+EXP_RED+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+expLen+' '+(C-expLen)+'" stroke-dashoffset="'+(-(incFrac*C))+'" transform="rotate(-90 60 60)"></circle>';
  } else {
    csvg = '<circle cx="60" cy="60" r="52" fill="none" stroke="#E3EBE3" stroke-width="10"></circle>';
  }
  el('c-donut').innerHTML = csvg;
  el('c-legend').innerHTML =
    '<span><i style="background:'+INC+'"></i>'+esc(t('income'))+' '+mmk(tt.income)+' · '+(incFrac*100).toFixed(0)+'%</span>'+
    '<span><i style="background:'+EXP_RED+'"></i>'+esc(t('expenses'))+' '+mmk(tt.expense)+' · '+(expFrac*100).toFixed(0)+'%</span>';
  /* top spending by category — this month */
  var by = expenseByCategory(prefix);
  var totalExp = by.reduce(function(a,r){ return a+r.amount; },0);
  el('t-top').innerHTML = by.length ? by.map(function(r){
    var pct = totalExp ? r.amount/totalExp*100 : 0;
    return '<div class="toprow"><span class="chip-ico">'+iconFor(r.cat)+'</span><span class="tm"><span class="tn">'+esc(catLabel(r.cat))+'</span><div class="pbar"><i style="width:'+pct.toFixed(1)+'%"></i></div></span><b class="expv">'+mmk(r.amount)+'</b></div>';
  }).join('') : '<p class="muted">'+esc(t('no_spending_month'))+'</p>';
  /* full transactions list — grouped by date, search-aware, with delete */
  var rows = sortedTxns().filter(function(r){ if(!uiSearch) return true; return (r.category+' '+catLabel(r.category)+' '+(r.note||'')).toLowerCase().indexOf(uiSearch)>=0; });
  if(!rows.length){ el('t-list').innerHTML = '<div class="listcard"><p class="muted" style="margin:4px 0">'+esc(t('no_transactions_found'))+'</p></div>'; }
  else {
    var groups={}, order=[];
    rows.forEach(function(r){ var d=r.txn_date||'—'; if(!groups[d]){ groups[d]={rows:[],income:0,expense:0}; order.push(d); } groups[d].rows.push(r); groups[d][r.kind]+=Number(r.amount||0); });
    var html='';
    order.forEach(function(d){
      var g=groups[d];
      html += '<div class="dayhead"><span>'+esc(fmtDateISO(d))+'</span><span>+' + mmk(g.income) + ' · <span class="expv">−' + mmk(g.expense) + '</span></span></div>';
      html += '<div class="listcard" style="padding-top:6px;padding-bottom:6px">' + g.rows.map(function(r){ return txnRow(r,true); }).join('') + '</div>';
    });
    el('t-list').innerHTML = html;
  }
  /* net worth breakdown */
  var gross = tt.accounts + tt.assets;
  var parts = [[t('accounts_savings'), tt.accounts], [t('nav_assets'), tt.assets]];
  el('a-breakdown').innerHTML = parts.map(function(r){
    var pct = gross ? r[1]/gross*100 : 0;
    return '<div style="margin-bottom:12px"><div class="rowbet"><span style="font-weight:700;font-size:.9rem">'+esc(r[0])+'</span><span><b>'+mmk(r[1])+'</b> <small>'+pct.toFixed(1)+'%</small></span></div><div class="pbar"><i style="width:'+pct.toFixed(1)+'%"></i></div></div>';
  }).join('') + '<div class="rowbet" style="border-top:1px solid rgba(16,20,16,.07);padding-top:10px"><span style="font-weight:700">'+esc(t('debts'))+'</span><b>−'+mmk(tt.debts)+'</b></div>' +

  var inField = !!(ae && (tag==='TEXTAREA' || tag==='SELECT' || (tag==='INPUT' && ae.type!=='button' && ae.type!=='checkbox')));

    if(ev.key==='Enter' && ae.id==='add-note'){ ev.preventDefault(); saveAdd(); }
    return;

}

}
function renderConvs(){
  var box=el('msg-convs'); if(box===DUMMY) return;
  var cs=(state.conversations||[]).filter(function(c){ return c.messages && c.messages.length; });
  cs=cs.slice().sort(function(a,b){
    var la=a.messages[a.messages.length-1], lb=b.messages[b.messages.length-1];
    return ((lb.id||0)-(la.id||0)) || String(lb.time||'').localeCompare(String(la.time||''));
  });
  box.innerHTML = '<div class="lbl" style="margin:2px 2px 2px">'+esc(t('msg_conversations'))+'</div>'+
    (cs.length ? cs.map(function(c){
      var p=personBy(c.username)||{name:c.name||c.username, username:c.username};
      var last=c.messages[c.messages.length-1];
      return '<button class="msgrow" onclick="openChat(\''+c.username+'\')">'+avatarHTML({username:c.username, name:p.name})+
        '<span class="tm"><span class="pn">'+esc(p.name)+'</span><span class="pu">'+esc(lastPreview(c))+'</span></span>'+
        '<span class="ptime">'+esc(last.time||'')+'</span></button>';
    }).join('') : '<p class="muted" style="margin:8px 2px">'+esc(t('msg_no_chats'))+'</p>');
}
function openChat(u){
  ensureConv(u);
  msgChatUser=u; msgView='chat';
  if(curPage!=='message'){ go('message'); } else { renderMessage(); }
  loadChatMessages(u);
  startChatPoll();
}
function msgBack(){ stopChatPoll(); msgView='home'; msgChatUser=''; renderMessage(); fetchConvs(); }
var chatPoll = null;
function startChatPoll(){ stopChatPoll(); chatPoll = setInterval(pollChat, 4000); }
function stopChatPoll(){ if(chatPoll){ clearInterval(chatPoll); chatPoll = null; } }
function pushMsg(u, m){
  var conv = ensureConv(u);
  for(var i=0;i<conv.messages.length;i++){ if(conv.messages[i].id===m.id) return conv; }
  conv.messages.push(m);
  return conv;
}
function appendBubble(m){
  var box = el('chat-msgs'); if(box===DUMMY) return;
  box.insertAdjacentHTML('beforeend', bubbleHTML(m));
  try{ box.scrollTop = 999999; }catch(e){}
}
function loadChatMessages(u){
  apiFetch('GET', '/api/conversations/'+encodeURIComponent(u)+'/messages').then(function(j){
    var conv = convBy(u); if(!conv) return;
    conv.messages = (j && j.messages) || [];
    conv.loaded = true;
    if(curPage==='message' && msgView==='chat' && msgChatUser===u){
      var box = el('chat-msgs');
      if(box!==DUMMY){ box.innerHTML = threadHTML(conv); try{ box.scrollTop = 999999; }catch(e){} }
      renderConvs();
    }
  }).catch(function(e){ if(e && e.auth) return; errFlash(); });
}
function fetchConvs(){
  apiFetch('GET', '/api/conversations').then(function(j){
    var list = (j instanceof Array) ? j : ((j && j.conversations) || []);
    var byU = {};
    (state.conversations||[]).forEach(function(c){ byU[c.username] = c; });
    state.conversations = list.map(function(c){
      var old = byU[c.username];
      if(old && old.loaded){ old.name = c.name || old.name; return old; }
      return {username:c.username, name:c.name||c.username, messages: c.last ? [c.last] : []};
    });
    if(curPage==='message') renderConvs();
  }).catch(function(){});
}
function pollChat(){
  if(curPage!=='message' || msgView!=='chat' || !msgChatUser) return;
  var conv = convBy(msgChatUser); if(!conv) return;
  var lastId = 0;
  conv.messages.forEach(function(m){ if(m.id && m.id > lastId) lastId = m.id; });
  var u = msgChatUser;
  apiFetch('GET', '/api/conversations/'+encodeURIComponent(u)+'/messages?after='+lastId).then(function(j){
    var msgs = (j && j.messages) || []; if(!msgs.length) return;
    var known = {};
    conv.messages.forEach(function(m){ known[m.id] = 1; });
    var added = false;
    msgs.forEach(function(m){ if(!known[m.id]){ conv.messages.push(m); if(msgChatUser===u && msgView==='chat') appendBubble(m); added = true; } });
    if(added) renderConvs();
  }).catch(function(){});
}
function sendMsg(){
  var inp=el('chat-input'); var v=(inp.value||'').trim(); if(!v) return;
  var to = msgChatUser; if(!to) return;
  if(inp!==DUMMY) inp.value='';
  apiFetch('POST', '/api/messages', {to:to, text:v}).then(function(j){
    if(j && j.message){
      pushMsg(to, j.message);
      if(curPage==='message' && msgView==='chat' && msgChatUser===to) appendBubble(j.message);
      renderConvs();
    }
  }).catch(function(e){ if(e && e.auth) return; errFlash(); });
}
function chatKey(ev){ if(ev && ev.key==='Enter'){ ev.preventDefault(); sendMsg(); } }
function todayTotals(){
  var td=(serverToday || todayISO()), inc=0, exp=0;
  state.transactions.forEach(function(r){ if(r.txn_date===td){ if(r.kind==='income') inc+=Number(r.amount||0); else exp+=Number(r.amount||0); } });
  return {income:inc, expense:exp, leftover:inc-exp};
}
function sharePillHTML(){
  return '<span class="sharepills"><button class="sharepill" onclick="shareCosts(\'day\')">'+svgI(MSG_ICONS.share)+esc(t('msg_share_cost'))+'</button><button class="sharepill" onclick="shareCosts(\'month\')">'+svgI(MSG_ICONS.share)+esc(t('msg_share_cost_month'))+'</button></span>';
}
function threadHTML(conv){
  /* The share pills are the FIRST element inside the scrollable thread, so
     they scroll away with the messages instead of staying pinned at the top. */
  return sharePillHTML() + conv.messages.map(bubbleHTML).join('');
}
function shareCosts(scope){
  var to = msgChatUser; if(!to) return;
  apiFetch('POST', '/api/messages', {to:to, type:'card', scope:(scope==='month' ? 'month' : 'day')}).then(function(j){
    if(j && j.message){
      pushMsg(to, j.message);
      if(curPage==='message' && msgView==='chat' && msgChatUser===to) appendBubble(j.message);
      renderConvs();
    }
  }).catch(function(e){ if(e && e.auth) return; errFlash(); });
}
function fmtBytes(n){
  n=Number(n||0);
  if(n<1024) return n+' B';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB';
  return (n/(1024*1024)).toFixed(1)+' MB';
}
function triggerAttach(){ var f=el('chat-file'); try{ if(f!==DUMMY && f.click) f.click(); }catch(e){} }
function onAttach(input){
  var file = input && input.files && input.files[0]; if(!file) return;
  addAttachment(file);
  try{ input.value=''; }catch(e){}
}
function addAttachment(file){
  var to = msgChatUser; if(!to || !file) return;
  if(file.size && file.size > 10*1024*1024){ flash(t('support_hint')); return; }
  var fd = new FormData();
  fd.append('to', to);
  fd.append('file', file);
  apiFetch('POST', '/api/messages', fd, true).then(function(j){
    if(j && j.message){
      pushMsg(to, j.message);
      if(curPage==='message' && msgView==='chat' && msgChatUser===to) appendBubble(j.message);
      renderConvs();
    }
  }).catch(function(e){ if(e && e.auth) return; errFlash(); });
}
function msgBody(m){
  if(m.type==='text') return esc(m.text);
  if(m.type==='card'){
    var ch = (m.scope==='month' && m.month)
      ? '<div class="ct">'+esc(t('msg_month_costs'))+' · '+esc(monthLabelLong(m.month))+'</div>'
      : '<div class="ct">'+esc(t('msg_today_costs'))+' · '+esc(fmtDateISO(m.txn_date))+'</div>';
    var items = (m.items && m.items.length) ? m.items : null;
    if(items){
      var shown = items.slice(0, 12);
      ch += shown.map(function(it){
        var lbl = esc(catLabel(it.category)) + (it.note ? ' · ' + esc(it.note) : '');
        var sign = it.kind === 'income' ? '+' : '−';
        var cls = it.kind === 'expense' ? ' class="expv"' : '';
        return '<div class="crow"><span>' + lbl + '</span><b' + cls + '>' + sign + mmk(it.amount) + '</b></div>';
      }).join('');
      if(items.length > shown.length){
        ch += '<div class="crow"><span>+' + (items.length - shown.length) + ' ' + esc(t('msg_more')) + '</span></div>';
      }
      ch += '<div class="cdiv"></div>';
    }
    ch += '<div class="crow"><span>'+esc(t('income'))+'</span><b>'+mmk(m.income)+'</b></div>'+
      '<div class="crow"><span>'+esc(t('expenses'))+'</span><b class="expv">'+mmk(m.expense)+'</b></div>'+
      '<div class="crow"><span>'+esc(t('leftover'))+'</span><b>'+mmk(m.leftover)+'</b></div>';
    return ch;
  }
  if((m.type==='image'||m.type==='video') && m.url){
    if(m.type==='image') return '<img class="chat-img" src="'+esc(m.url)+'" alt="'+esc(m.name||'')+'">';
    return '<video class="chat-vid" controls src="'+esc(m.url)+'"></video>';
  }
  var note = (m.type==='image'||m.type==='video') ? '<span class="fs">'+esc(t('msg_attach_session'))+'</span>' : '';
  return '<span class="filecard"><span class="fic">'+svgI(MSG_ICONS.file)+'</span><span class="tm"><span class="fn">'+esc(m.name||t('msg_file_label'))+'</span><span class="fs">'+esc(t('msg_file_label'))+' · '+esc(fmtBytes(m.size))+'</span>'+note+'</span></span>';
}
function bubbleHTML(m){
  /* Direction (me/them) is chosen from m.from for EVERY message type first;
     cardmsg is only an extra surface class for cost cards. (Cards used to
     hard-code 'me' here, so received cards rendered as if sent by the viewer.) */
  var cls = 'bub '+(m.from==='me'?'me':'them')+(m.type==='card'?' cardmsg':'');
  return '<div class="'+cls+'">'+msgBody(m)+'<span class="btime">'+esc(m.time||'')+'</span></div>';
}
function renderMessage(){
  var root=el('msg-root'); if(root===DUMMY) return;
  /* STATE A — gate */
  if(!state.myUsername && msgView!=='setup'){
    root.innerHTML =
      '<div class="card msg-gate">'+
        '<span class="msg-gate-ico">'+svgI(MSG_ICONS.chat)+'</span>'+
        '<h3 class="msg-gate-title">'+esc(t('msg_need_username'))+'</h3>'+
        '<p class="msg-gate-sub">'+esc(t('msg_gate_sub'))+'</p>'+
        '<button class="msg-plus" onclick="msgShowSetup()" aria-label="'+esc(t('msg_create_username'))+'">'+svgI('<path d="M12 5v14M5 12h14"/>')+'</button>'+
        '<div class="msg-create-label">'+esc(t('msg_create_username'))+'</div>'+
      '</div>';
    return;
  }
  /* Username setup / edit form */
  if(msgView==='setup'){
    var cur=state.myUsername||'';
    var dn=state.myDisplay||((state.profile?(state.profile.first+' '+state.profile.last).trim():'')||'');
    root.innerHTML =
      '<div class="card msg-setup">'+
        '<div class="lbl" style="margin-bottom:6px">'+esc(t(cur?'msg_edit_username':'msg_create_username'))+'</div>'+
        '<form onsubmit="return saveUsername(event)">'+
          '<div class="field"><label>'+esc(t('msg_username_label'))+'</label>'+
            '<div class="msg-atwrap"><span class="msg-at">@</span><input id="mu-name" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="'+esc(t('msg_username_ph'))+'" value="'+esc(cur)+'" oninput="msgUserCheck()"></div>'+
            '<div class="msg-hint" id="mu-hint">'+esc(t('msg_username_hint'))+'</div></div>'+
          '<div class="field"><label>'+esc(t('msg_display_name'))+' ('+esc(t('optional_word'))+')</label><input id="mu-display" type="text" value="'+esc(cur?dn:'')+'" placeholder="'+esc((state.profile?state.profile.first+' '+state.profile.last:'').trim())+'"></div>'+
          '<button class="btn primary" type="submit" style="width:100%">'+esc(t(cur?'msg_save_username':'msg_create_username'))+'</button>'+
        '</form>'+
        (cur?'<button class="btn glassb" style="width:100%;margin-top:10px" onclick="msgCancelSetup()">'+esc(t('msg_back'))+'</button>':'')+
      '</div>';
    msgUserCheck();
    return;
  }
  /* MAIN — two-pane on desktop, single-pane on mobile */
  var left =
    '<div class="card" style="padding:13px 16px"><div class="msg-userchip"><span class="lbl">'+esc(t('msg_your_username'))+'</span>'+
      '<span class="msg-atchip">@'+esc(state.myUsername)+'</span>'+
      (state.myDisplay?'<span class="muted" style="font-size:12.5px">'+esc(state.myDisplay)+'</span>':'')+
      '<button class="msg-editbtn" onclick="msgShowSetup()">'+esc(t('edit'))+'</button></div></div>'+
    '<div class="msg-search">'+svgI(MSG_ICONS.search)+'<input type="text" id="msg-search-in" placeholder="'+esc(t('msg_search_ph'))+'" value="'+esc(msgSearch)+'" oninput="msgSetSearch(this.value)"></div>'+
    '<div class="listcard"><div id="msg-convs"></div></div>'+
    '<div class="listcard" id="msg-results-card" style="display:none"><div id="msg-results"></div></div>'+
    '';
  var right = '';
  if(msgView==='chat' && msgChatUser){
    var p2=personBy(msgChatUser)||{name:msgChatUser, username:msgChatUser, tag:''};
    var conv2=ensureConv(msgChatUser);
    right =
      '<div class="chat-head"><button class="chat-back" onclick="msgBack()" aria-label="'+esc(t('msg_back'))+'">'+svgI(MSG_ICONS.back)+'</button>'+
        avatarHTML(p2)+
        '<span class="tm"><span class="pn">'+esc(p2.name)+'</span><span class="pu">@'+esc(p2.username)+' · <span class="chat-online">'+esc(t('msg_online'))+'</span></span></span></div>'+
      '<div class="bubbles" id="chat-msgs">'+threadHTML(conv2)+'</div>'+
      '<div class="composer">'+
        '<button class="attachbtn" onclick="triggerAttach()" aria-label="'+esc(t('msg_attach'))+'">'+svgI(MSG_ICONS.clip)+'</button>'+
        '<input type="file" id="chat-file" style="display:none" accept="image/*,video/*,.pdf,.doc,.docx,.txt,.zip" onchange="onAttach(this)">'+
        '<input type="text" id="chat-input" placeholder="'+esc(t('msg_type_ph'))+'" onkeydown="chatKey(event)">'+
        '<button class="sendbtn" onclick="sendMsg()" aria-label="'+esc(t('msg_send'))+'">'+svgI(MSG_ICONS.send)+'</button>'+
      '</div>'+
      '<div class="attach-note">'+esc(t('msg_attach_note'))+'</div>';
  } else {
    right = '<div class="msg-empty"><span class="msg-gate-ico">'+svgI(MSG_ICONS.chat)+'</span><p>'+esc(t('msg_select_chat'))+'</p></div>';
  }
  root.innerHTML = '<div class="msg-layout'+(msgView==='chat'&&msgChatUser?' chat-open':'')+'"><div class="msg-left">'+left+'</div><div class="msg-right">'+right+'</div></div>';
  renderConvs();
  renderSearchResults();
  if(msgView==='chat'){ try{ var b=el('chat-msgs'); if(b!==DUMMY && b.scrollTop!==undefined) b.scrollTop=999999; }catch(e){} }
  return;
}
function renderSettingsMsg(){
  var box=el('settings-msg'); if(box===DUMMY) return;
  if(state.myUsername){
    box.innerHTML='<div class="rowbet"><span style="font-size:14px"><span class="muted">'+esc(t('msg_your_username'))+': </span><b>@'+esc(state.myUsername)+'</b></span><button class="msg-editbtn" onclick="msgShowSetup()">'+esc(t('edit'))+'</button></div>';
  } else {
    box.innerHTML='<div class="rowbet"><span class="muted" style="font-size:13.5px">'+esc(t('msg_need_username'))+'</span><button class="msg-openbtn" onclick="goMessage();msgShowSetup()">'+esc(t('msg_create_username'))+'</button></div>';
  }
}

/* ================= UI12 Support chat (user <-> admin) ================= */
function ensureSupport(){ if(!state.support || !state.support.messages) state.support = {messages:[]}; return state.support; }
function renderSupport(){
  var sup = ensureSupport();
  var dEl = el('sup-date'); if(dEl !== DUMMY) dEl.textContent = fmtDateObj(new Date(), {weekday:'short', day:'numeric', month:'short', year:'numeric'});
  try{ var li = document.querySelector('.logo-tile img'); var si = el('sup-logo'); if(li && si !== DUMMY && li.getAttribute('src')) si.setAttribute('src', li.getAttribute('src')); }catch(e){}
  var box = el('sup-msgs'); if(box === DUMMY) return;
  var greet = {from:'them', type:'text', text:t('support_greeting'), time:''};
  box.innerHTML = [greet].concat(sup.messages).map(bubbleHTML).join('');
}
var supPoll = null;
function startSupPoll(){ stopSupPoll(); supPoll = setInterval(syncSupport, 5000); }
function stopSupPoll(){ if(supPoll){ clearInterval(supPoll); supPoll = null; } }
function pushSup(m){
  var sup = ensureSupport();
  for(var i=0;i<sup.messages.length;i++){ if(sup.messages[i].id===m.id) return; }
  sup.messages.push(m);
}
function appendSupBubble(m){
  var box = el('sup-msgs'); if(box===DUMMY) return;
  box.insertAdjacentHTML('beforeend', bubbleHTML(m));
}
function syncSupport(){
  return apiFetch('GET', '/api/support').then(function(j){
    var msgs = (j && j.messages) || [];
    var sup = ensureSupport();
    var known = {};
    sup.messages.forEach(function(m){ known[m.id] = 1; });
    msgs.forEach(function(m){
      if(!known[m.id]){ sup.messages.push(m); if(curPage==='support') appendSupBubble(m); }
    });
  }).catch(function(){});
}
function sendSupport(){
  var inp = el('sup-input'); var v = (inp.value || '').trim(); if(!v) return;
  if(inp !== DUMMY) inp.value = '';
  apiFetch('POST', '/api/support', {text:v}).then(function(j){
    if(j && j.message){ pushSup(j.message); if(curPage==='support') appendSupBubble(j.message); }
    else syncSupport();
  }).catch(function(e){ if(e && e.auth) return; errFlash(); });
}
function supKey(ev){ if(ev && ev.key === 'Enter'){ ev.preventDefault(); sendSupport(); } }
function triggerSupAttach(){ var f = el('sup-file'); try{ if(f !== DUMMY && f.click) f.click(); }catch(e){} }
function onSupAttach(input){
  var file = input && input.files && input.files[0]; if(!file) return;
  addSupportAttachment(file);
  try{ input.value = ''; }catch(e){}
}
function addSupportAttachment(file){
  if(!file) return;
  if(file.size && file.size > 10*1024*1024){ flash(t('support_hint')); return; }
  var fd = new FormData();
  fd.append('file', file);
  apiFetch('POST', '/api/support', fd, true).then(function(j){
    if(j && j.message){ pushSup(j.message); if(curPage==='support') appendSupBubble(j.message); }
    else syncSupport();
  }).catch(function(e){ if(e && e.auth) return; errFlash(); });
}

/* ================= UI12 Profile photo ================= */
function applyProfilePhoto(url){
  if(!url) url = '/api/profile/photo';
  photoVer++;
  state.profilePhoto = url + (url.indexOf('?')>=0 ? '&' : '?') + 'v=' + photoVer;
  if(state.profile) state.profile.photo = true;
  renderProfile();
}
function removeProfilePhoto(){
  apiFetch('DELETE', '/api/profile/photo').then(function(){
    state.profilePhoto = '';
    if(state.profile) state.profile.photo = false;
    photoVer++;
    renderProfile();
  }).catch(function(e){ apiFail(e); });
}
function triggerProfilePhoto(){ var f = el('pf-photo-file'); try{ if(f !== DUMMY && f.click) f.click(); }catch(e){} }
function onProfilePhotoPick(input){
  var file = input && input.files && input.files[0]; if(!file) return;
  processProfilePhotoFile(file);
  try{ input.value = ''; }catch(e){}
}
function processProfilePhotoFile(file){
  if(!file || !file.type || file.type.indexOf('image/') !== 0) return;
  var fd = new FormData();
  fd.append('photo', file);
  apiFetch('POST', '/api/profile/photo', fd, true).then(function(){
    applyProfilePhoto('/api/profile/photo');
  }).catch(function(e){ apiFail(e); });
}

/* ---- init ---- */
try{ boot(); }catch(e){}


</script>
</body>
