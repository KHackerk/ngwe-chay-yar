<style>
/* ============ Ngwe Chay Yar — UI3 Glass design system ============ */
:root{
  --ink:#101410; --ink2:#2A332A; --muted:#5F6B5F;
  --green:#16A34A; --green-b:#22C55E; --green-xl:#4ADE80; --mint:#DCFCE7; --mint2:#BBF7D0;
  --deep:#14532D; --deep2:#0B3D24; --exp-red:#D92D20;
  --hair:rgba(16,20,16,.07); --hair2:rgba(16,20,16,.05);
  --glass:rgba(255,255,255,.58);
  --glass-brd:rgba(255,255,255,.75);
  --shadow:0 12px 40px rgba(11,61,36,.10);
  --shadow-sm:0 4px 18px rgba(11,61,36,.07);
  --r:20px;
  --bg:var(--bg); --glass-hi:rgba(255,255,255,.62); --glass-lo:rgba(255,255,255,.48); --glass-menu:var(--glass-menu);
  --field-bg:var(--field-bg); --field-brd:var(--field-brd); --keybg:var(--keybg); --keybrd:var(--keybrd);
  --mint-glass:var(--mint-glass); --gridline:rgba(16,20,16,.05); --track:var(--track);
  --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"Noto Sans Myanmar","Pyidaungsu",sans-serif;
  --myfont:"Noto Sans Myanmar","Pyidaungsu",-apple-system,"Segoe UI",Roboto,sans-serif;
}
html{color-scheme:light}
html[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
/* living background orbs (fixed, blurred) */
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.orb.o1{width:520px;height:520px;background:rgba(20,83,45,.20);top:-180px;right:-120px}
.orb.o2{width:460px;height:460px;background:rgba(34,197,94,.16);bottom:-160px;left:-140px}
.orb.o3{width:380px;height:380px;background:rgba(95,107,95,.14);top:38%;left:44%}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit}
img{display:block}
.num,.sv,.wv,.ta,.big,.amt,.dv,b,strong{font-variant-numeric:tabular-nums}
/* Myanmar text rules */
.my{font-family:var(--myfont);letter-spacing:0!important;text-transform:none!important;line-height:1.9;overflow-wrap:normal;white-space:normal}
.my-sub{display:block;font-family:var(--myfont);font-size:12.5px;color:var(--muted);letter-spacing:0!important;text-transform:none!important;line-height:1.9;margin-top:2px}
/* labels: English-only small caps */
.lbl,.sl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.green-t{color:var(--green)}

/* ============ layout ============ */
.layout{position:relative;z-index:1}
.center{max-width:480px;margin:0 auto;padding:14px 16px 128px}
.sidebar,.rightpanel{display:none}

/* ============ floating glass top bar (mobile) ============ */
.mobiletop{position:sticky;top:12px;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--glass-hi);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--hair2);border-radius:18px;padding:10px 12px}
.brandrow{display:flex;align-items:center;gap:11px;min-width:0}
.logo-tile{flex:none;width:42px;height:42px;border-radius:12px;background:#111111;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.logo-tile img{width:100%;height:100%;object-fit:cover}
.logo-tile.lg{width:54px;height:54px;border-radius:14px}
.brandname{font-weight:650;font-size:16px;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
.brandsub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:700}
.iconbtns{display:flex;gap:8px}
.icobtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--hair);background:var(--field-bg);display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:transform .2s,box-shadow .2s}
.icobtn svg{width:19px;height:19px}
.icobtn:active{transform:scale(.96)}

/* ============ desktop head ============ */
.deskhead{display:none}

/* ============ flash ============ */




.flash{display:none;margin-top:12px;background:rgba(9,14,10,.92);color:#fff;border-radius:14px;padding:11px 16px;font-size:13.5px;line-height:1.8;letter-spacing:0;box-shadow:var(--shadow)}

/* ============ pages ============ */
.page{display:none}
.page.active{display:block;animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page.active{animation:none}*{transition:none!important}}

/* ============ glass card ============ */
.card{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow),inset 0 0 0 1px var(--hair2);border-radius:var(--r);padding:18px;margin-bottom:14px}
.listcard{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow),inset 0 0 0 1px var(--hair2);border-radius:var(--r);padding:4px 16px;margin-bottom:14px}
.sechead{margin:22px 2px 10px}
.sechead h2{display:inline;font-size:17px;font-weight:650;letter-spacing:-.015em}
.rowbet{display:flex;align-items:center;justify-content:space-between;gap:10px}
.linkbtn{background:none;border:none;color:var(--green);font-size:13px;font-weight:600;padding:4px 2px}

/* ============ home ============ */
.dateline{margin:18px 2px 4px;font-size:13px;color:var(--muted)}
.dateline b{color:var(--ink2);font-weight:600}
.spendwrap{text-align:center;padding:10px 0 18px}
.spendwrap .amt{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:6px}
.spendwrap .vs{font-size:13px;color:var(--muted);margin-top:5px}
.spendwrap .vs b{color:var(--ink2)}
.hero{background:linear-gradient(135deg,rgba(9,14,10,.92),rgba(11,61,36,.88));-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 44px rgba(9,14,10,.22);border-radius:var(--r);padding:20px;color:#fff;margin-bottom:14px}
.hero .lbl{color:var(--field-bg)}
.hero .big{font-size:31px;font-weight:700;letter-spacing:-.02em;margin:6px 0 4px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;margin-top:10px}
.hero-grid>div{padding:12px 0 2px}
.hero-grid>div:nth-child(1){padding-right:14px;border-right:1px solid rgba(255,255,255,.12)}
.hero-grid>div:nth-child(2){padding-left:14px}
.hero-grid>div:nth-child(3){grid-column:1/-1;border-top:1px solid rgba(255,255,255,.12);margin-top:8px}
.hero-grid span{display:block;font-size:11.5px;color:var(--field-bg);margin-bottom:2px}
.hero-grid b{font-size:14.5px;font-weight:650;color:#fff}
.hero-grid b.neg{color:#fff}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px}
.stat{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--hair2);border-radius:var(--r);padding:15px 16px}
.stat .sv{font-size:18.5px;font-weight:650;letter-spacing:-.01em;margin-top:5px}
.stat .sv.g{color:var(--green)}

/* icon chip + hairline rows */
.chip-ico{flex:none;width:36px;height:36px;border-radius:50%;background:rgba(34,197,94,.10);color:var(--deep);display:flex;align-items:center;justify-content:center}
.chip-ico svg{width:19px;height:19px}
.chip-ico.dk{background:#111111;color:var(--green-xl)}
.txn,.wrow,.mgrrow,.toprow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair)}
.txn:last-child,.wrow:last-child,.mgrrow:last-child,.toprow:last-child{border-bottom:none}
.tm{flex:1;min-width:0}
.tn{font-size:14px;font-weight:550;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td{font-size:12px;color:var(--muted);margin-top:1px}
.ta{font-size:14px;font-weight:600;white-space:nowrap}
.ta.income{color:var(--green)}
.ta.expense{color:var(--exp-red)}
.wv{font-size:14.5px;font-weight:650;white-space:nowrap}
.wrow.total .tn{font-weight:650}
.mgrrow b{font-size:14px}
.mgrrow .tm b{font-size:14px;font-weight:600}
.mgrrow small{color:var(--muted);font-size:12px;font-weight:400}
.delbtn{flex:none;width:27px;height:27px;border-radius:50%;border:1px solid var(--hair);background:var(--keybg);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.delbtn svg{width:12px;height:12px}
.delbtn:active{transform:scale(.94)}

/* top spending bars */
.pbar{height:5px;background:rgba(16,20,16,.06);border-radius:999px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green-b),var(--green))}

/* donut */
.donutwrap{position:relative;width:190px;height:190px;margin:6px auto 4px}
.donutwrap svg{width:190px;height:190px}
.donut-centre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 34px}
.donut-centre .dl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;line-height:1.5}
.donut-centre .dv{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dayhead{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin:18px 2px 8px;text-transform:uppercase}

/* analytics bars */
.bars{display:flex;align-items:flex-end;height:180px;gap:8px;padding-top:14px;border-bottom:1px solid var(--hair);
  background:repeating-linear-gradient(to top,transparent 0,transparent 44px,var(--gridline) 44px,var(--gridline) 45px)}
.bcol{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}
.bpair{display:flex;align-items:flex-end;gap:4px;height:100%}
.bpair i{display:block;width:16px;border-radius:6px 6px 2px 2px}
.bpair i.inc{background:linear-gradient(180deg,var(--green-b),var(--deep))}
.bpair i.exp{background:var(--exp-red)}
.blab{font-size:11px;color:var(--muted);padding-top:7px}
.legend-dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.sumcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sumcard{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-brd);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--hair2);border-radius:var(--r);padding:15px 16px}
.sumcard .sv{font-size:18.5px;font-weight:650;margin-top:5px}
.sumcard.inc .sv{color:var(--green)}
.totalhead{font-size:15px;font-weight:650;letter-spacing:-.01em;margin-bottom:4px}

/* ============ forms / buttons ============ */
.field{margin:13px 0}
.field label{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;background:var(--field-bg);border:1px solid var(--field-brd);border-radius:12px;padding:11px 13px;font-size:14.5px;color:var(--ink);outline:none;transition:box-shadow .2s,border-color .2s}
.field input:focus,.field select:focus{border-color:rgba(34,197,94,.5);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:999px;padding:11px 20px;font-size:13.5px;font-weight:600;letter-spacing:.01em;transition:transform .15s,box-shadow .2s}
.btn.primary{background:#111111;color:#fff;box-shadow:0 8px 22px rgba(9,14,10,.18)}
.btn.green{background:var(--green);color:#fff}
.btn.glassb{background:var(--field-bg);border:1px solid var(--hair);color:var(--ink)}
.btn:active{transform:scale(.98)}
.addform{border-top:1px solid var(--hair);margin-top:14px;padding-top:6px}
.addform h3{font-size:14px;font-weight:650;margin:12px 0 2px}

/* ============ add / keypad ============ */
.toggle{display:flex;background:var(--keybg);border:1px solid var(--hair);border-radius:999px;padding:4px;gap:4px}
.toggle button{flex:1;border:none;background:transparent;border-radius:999px;padding:9px 0;font-size:13.5px;font-weight:600;color:var(--muted);transition:all .2s}
.toggle button.on{background:#111111;color:#fff;box-shadow:0 4px 14px rgba(9,14,10,.18)}
.toggle #tg-income.on{background:var(--green);box-shadow:0 4px 14px rgba(22,163,74,.28)}
.amountbig{text-align:center;font-size:32px;font-weight:700;letter-spacing:-.01em;margin:20px 0 0;font-variant-numeric:tabular-nums}
.amountsub{text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:3px}

.chip{border:1px solid var(--hair);background:var(--glass-lo);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:550;transition:all .15s}
.chip.on{background:#111111;color:#fff;border-color:#111111}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.catcell{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 2px 10px;border-radius:16px;border:1px solid var(--hair2);background:var(--glass-lo);font-size:11.5px;font-weight:550;color:var(--ink2);transition:all .15s}
.catcell .chip-ico{width:38px;height:38px}
.catcell.on{border-color:rgba(34,197,94,.55);background:var(--mint-glass);box-shadow:0 0 0 1px rgba(34,197,94,.25)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,clamp(56px,9dvh,66px));column-gap:8px;row-gap:6px;width:100%;max-width:340px;margin:16px auto 0;justify-items:center;align-items:center}
.keypad button{background:var(--keybg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--keybrd);box-shadow:inset 0 0 0 1px var(--hair2),inset 0 1px 0 rgba(255,255,255,.14),var(--shadow-sm);border-radius:50%;width:clamp(56px,9dvh,66px);height:clamp(56px,9dvh,66px);padding:0;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;transition:transform .1s,background .15s}
@media (hover:hover) and (pointer:fine){.keypad button:hover{background:var(--glass-hi)}}
.keypad button:active{transform:scale(.93);background:var(--mint-glass)}
.keypad button.kp-fn{font-size:15px;color:var(--muted)}
.savebtn{width:100%;margin-top:16px;background:#111111;color:#fff;border:none;border-radius:999px;padding:14px 0;font-size:14px;font-weight:600;box-shadow:0 10px 26px rgba(9,14,10,.20);transition:transform .15s}
.savebtn:active{transform:scale(.99)}

/* ============ account ============ */
.profhead{display:flex;align-items:center;gap:13px}
.avatar{flex:none;width:47px;height:47px;border-radius:50%;background:linear-gradient(135deg,var(--deep),var(--green));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:650;overflow:hidden;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.photorow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.photorow .btn{display:inline-flex;align-items:center;gap:7px}
.photorow .btn svg{width:16px;height:16px}
.editbtn{margin-left:auto;background:var(--field-bg);border:1px solid var(--hair);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600}
.membercard{background:linear-gradient(135deg,rgba(9,14,10,.92),rgba(11,61,36,.88));border:1px solid rgba(255,255,255,.14);border-radius:var(--r);padding:16px 18px;color:#fff;display:flex;align-items:center;gap:13px;margin-bottom:14px;box-shadow:0 14px 34px rgba(9,14,10,.18)}
.membercard .mt{font-weight:650;font-size:15px;letter-spacing:-.01em}
.membercard .ms{font-size:12px;color:var(--glass-hi);margin-top:1px}
.menu{padding:4px 16px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--hair);padding:13px 0;font-size:14px;font-weight:550;text-align:left}
.menu button:last-child{border-bottom:none}
.menu .arr{margin-left:auto;color:var(--muted);display:flex}
.menu .arr svg{width:16px;height:16px}

/* ============ floating glass bottom nav ============ */
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(448px,calc(100% - 28px));z-index:70;
  background:var(--glass-hi);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-brd);box-shadow:0 16px 40px rgba(11,61,36,.16),inset 0 0 0 1px var(--hair2);border-radius:999px}
.bn-in{display:flex;align-items:flex-end;justify-content:space-around;padding:8px 10px}
.bn-in>button[data-nav]{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:3px 8px;min-width:56px}
.bn-in>button[data-nav] svg{width:21px;height:21px}
.bn-in>button[data-nav].active{color:var(--green)}
.plusbtn{flex:none;width:52px;height:52px;border-radius:50%;background:#111111;color:#fff;border:2px solid rgba(34,197,94,.55);box-shadow:0 10px 24px rgba(9,14,10,.28),0 0 0 4px var(--glass-hi);display:flex;align-items:center;justify-content:center;transform:translateY(-13px);transition:transform .15s}
.plusbtn svg{width:22px;height:22px}
.plusbtn:active{transform:translateY(-13px) scale(.96)}

/* ============ desktop ============ */
@media (min-width:1024px){
  .orb.o1{width:640px;height:640px;background:rgba(20,83,45,.24)}
  .orb.o2{width:560px;height:560px}
  body{background:linear-gradient(120deg,var(--bg) 55%,var(--mint-glass) 82%,rgba(11,61,36,.10))}
  .layout{display:grid;grid-template-columns:264px minmax(0,1fr) 322px;gap:24px;max-width:1460px;margin:0 auto;padding:24px;align-items:start}
  .mobiletop,.bottomnav{display:none}
  .center{max-width:780px;width:100%;margin:0 auto;padding:0 0 40px}
  .sidebar{display:flex;flex-direction:column;gap:6px;position:sticky;top:24px;height:calc(100vh - 48px);
    background:var(--field-bg);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--glass-brd);border-right:1px solid var(--glass-brd);box-shadow:var(--shadow),inset 0 0 0 1px var(--hair2);border-radius:var(--r);padding:20px 16px}
  .side-nav{display:flex;flex-direction:column;gap:2px;margin-top:20px}
  .side-nav button,.side-foot button{display:flex;align-items:center;gap:11px;background:none;border:none;border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:550;color:var(--ink2);text-align:left;transition:background .15s}
  .side-nav button svg,.side-foot button svg{width:19px;height:19px;color:var(--muted)}
  .side-nav button:hover,.side-foot button:hover{background:var(--glass-hi)}
  .side-nav button.active{background:var(--mint-glass);color:var(--deep)}
  .side-nav button.active svg{color:var(--green)}
  .promo{margin-top:22px;background:var(--mint-glass);border:1px solid var(--glass-brd);border-radius:16px;padding:16px}
  .promo p{font-size:12.5px;line-height:1.6;color:var(--ink2);margin:0 0 12px}
  .side-foot{margin-top:auto;border-top:1px solid var(--hair);padding-top:10px;display:flex;flex-direction:column;gap:2px}
  .deskhead{display:block;margin-bottom:4px}
  .deskhead h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:2px 0 14px}
  .searchbar{display:flex;align-items:center;gap:9px;background:var(--glass-hi);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-brd);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--hair2);border-radius:999px;padding:10px 16px;color:var(--muted)}
  .searchbar svg{width:17px;height:17px;flex:none}
  .searchbar input{border:none;background:none;outline:none;flex:1;font-size:14px;color:var(--ink)}
  .tabrow{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
  .tabpill{border:1px solid var(--hair);background:var(--glass-lo);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--ink2);transition:all .2s}
  .tabpill.active,.tabpill[data-nav].active{background:#111111;color:#fff;border-color:#111111}
  .rightpanel{display:flex;flex-direction:column;gap:14px;position:sticky;top:24px}
  .rp-dark{background:linear-gradient(135deg,rgba(9,14,10,.92),rgba(11,61,36,.88));-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,.14);border-radius:var(--r);padding:20px;color:#fff;box-shadow:0 18px 44px rgba(9,14,10,.20)}
  .rp-dark .lbl{color:var(--field-bg)}
  .rp-dark .big{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:5px 0 3px}
  .rp-dark .sub{font-size:12px;color:var(--green-xl)}
  .rp-dark .rp-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
  .rp-dark .rp-row span{color:var(--glass-hi)}
  .rp-dark .rp-row b{font-weight:650}
  .rp-card .rp-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--hair);font-size:13px;color:var(--ink2)}
  .rp-card .rp-row:first-child{border-top:none}
  .rp-card .rp-row small{color:var(--muted);font-size:11.5px}
  .rp-card .rp-row b{font-weight:650;color:var(--ink)}
  .rp-card{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-brd);box-shadow:var(--shadow),inset 0 0 0 1px var(--hair2);border-radius:var(--r);padding:18px}
  .rp-card .wrow{padding:10px 0}
  .phone-mock{border:1px solid var(--hair);border-radius:26px;padding:15px;background:var(--glass-lo)}
  .pm-line{height:8px;border-radius:99px;background:var(--track);margin:11px 0}
  .pm-line.g{background:rgba(34,197,94,.45)}
  .pm-bar-row{display:flex;align-items:flex-end;gap:7px;height:56px;margin-top:14px}
  .pm-bar-row i{flex:1;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--green-b),var(--deep))}
  .pm-bar-row i.l{background:var(--mint2)}
  .card,.stat,.sumcard,.listcard{transition:transform .2s,box-shadow .2s}
  .card:hover,.stat:hover,.sumcard:hover{transform:translateY(-1px);box-shadow:0 16px 44px rgba(11,61,36,.13)}
}



/* ============ UI6 merged Analytics + Transactions screen ============ */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;align-items:stretch}
.duo>.card{margin-bottom:0;height:100%}
.duo-card{padding:14px}
.duo .lbl{line-height:1.6}
.duo-legend{font-size:10.5px;color:var(--muted);white-space:nowrap}
.bars-sm{height:118px;padding-top:10px;background:repeating-linear-gradient(to top,transparent 0,transparent 29px,var(--gridline) 29px,var(--gridline) 30px)}
.bars-sm .bpair{gap:3px}
.bars-sm .bpair i{width:11px;border-radius:5px 5px 2px 2px}
.bars-sm + div .blab{font-size:10px;padding-top:6px}
.donut-sm{width:148px;height:148px;margin:4px auto 2px}
.donut-sm svg{width:148px;height:148px}
.donut-sm .donut-centre{padding:0 27px}
.donut-sm .donut-centre .dv{font-size:15px}
#c-legend{flex-direction:column;align-items:center;gap:4px;font-size:11.5px;margin-top:6px}
.sumstrip{display:flex;padding:8px 2px}
.ss-cell{flex:1;text-align:center;padding:8px 3px;border-right:1px solid var(--hair);min-width:0}
.ss-cell:last-child{border-right:none}
.ss-cell .sv{font-size:14.5px;font-weight:650;margin-top:4px;line-height:1.45}
.ss-cell .sv.g{color:var(--green)}
@media (max-width:380px){
  .duo{gap:9px}
  .duo-card{padding:11px}
  .donut-sm{width:126px;height:126px}
  .donut-sm svg{width:126px;height:126px}
  .donut-sm .donut-centre{padding:0 22px}
  .donut-sm .donut-centre .dv{font-size:13px}
  .ss-cell .sv{font-size:13px}
}

/* ============ UI5 i18n / language system ============ */
/* Uppercase tracked labels: ENGLISH ONLY */
.lbl,.sl,.field label,.dayhead,.donut-centre .dl,.amountsub{letter-spacing:0!important;text-transform:none!important;line-height:1.75}
body.lang-en .lbl,body.lang-en .sl,body.lang-en .field label,body.lang-en .amountsub{letter-spacing:.08em!important;text-transform:uppercase!important;line-height:1.5}
body.lang-en .dayhead{letter-spacing:.04em!important;text-transform:uppercase!important}
body.lang-en .donut-centre .dl{letter-spacing:.08em!important;text-transform:uppercase!important}

/* Myanmar: Myanmar font first, tall leading, no tracking */
body.lang-my{font-family:"Noto Sans Myanmar","Pyidaungsu",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif}
body.lang-my .lbl,body.lang-my .sl,body.lang-my .field label,body.lang-my .dayhead,body.lang-my .donut-centre .dl,body.lang-my .amountsub,body.lang-my .sechead h2,body.lang-my .totalhead,body.lang-my .addform h3{font-family:"Noto Sans Myanmar","Pyidaungsu",sans-serif;letter-spacing:0!important;line-height:1.9}
/* Thai: stacked vowels/tone marks need tall leading too */
body.lang-th .lbl,body.lang-th .sl,body.lang-th .field label,body.lang-th .dayhead,body.lang-th .donut-centre .dl,body.lang-th .amountsub,body.lang-th .sechead h2,body.lang-th .totalhead,body.lang-th .addform h3{letter-spacing:0!important;line-height:1.8}
/* Chinese: comfortable leading */
body.lang-zh .lbl,body.lang-zh .sl,body.lang-zh .field label,body.lang-zh .dayhead,body.lang-zh .donut-centre .dl,body.lang-zh .amountsub{letter-spacing:0!important;line-height:1.65}
/* Never clip translated labels: wrapping allowed everywhere */
.sechead h2{display:inline-block;max-width:100%}
.tn{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.55}
.catcell{height:auto;min-height:78px}
.catcell span:last-child{line-height:1.6;text-align:center;overflow-wrap:break-word}
.chip{line-height:1.6;text-align:center}
.bn-in>button[data-nav] span{line-height:1.5;text-align:center}
.side-nav button span,.side-foot button span,.menu button{line-height:1.65}
.hero-grid span{line-height:1.7}
.tabpill{line-height:1.6}
.desk-toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.desk-toprow h1{flex:1;min-width:0}
/* Language button + glass menu */
.langwrap{position:relative;flex:none}
.langbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hair);background:var(--field-bg);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--ink2);line-height:1.6;transition:transform .15s,box-shadow .2s;white-space:nowrap}
.langbtn svg{width:17px;height:17px;flex:none;color:var(--deep)}
.langbtn:active{transform:scale(.97)}
.langmenu{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:90;min-width:172px;background:var(--glass-menu);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-brd);box-shadow:var(--shadow),inset 0 0 0 1px var(--hair2);border-radius:16px;padding:6px}
.langopt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:none;border-radius:11px;padding:9px 11px;font-size:14px;font-weight:550;line-height:1.7;text-align:left}
.langopt:hover{background:var(--mint-glass)}
.langopt.on{background:var(--mint-glass);color:var(--deep);font-weight:650}
.langcheck{display:inline-flex;color:var(--green)}
.langcheck svg{width:16px;height:16px}
/* Settings language rows */
.langrow{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;border-bottom:1px solid var(--hair);padding:12px 2px;font-size:14.5px;font-weight:550;line-height:1.7;text-align:left}
.langrow:last-child{border-bottom:none}
.langrow.on{color:var(--deep);font-weight:650}
.langrow-ico{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(34,197,94,.10);color:var(--deep);display:flex;align-items:center;justify-content:center}
.langrow-ico svg{width:18px;height:18px}
.langrow-name{flex:1}
.langrow .langcheck{margin-left:auto}

/* ============ UI7 Message (user-to-user chat, on-device demo) ============ */
.msg-plus{width:56px;height:56px;border-radius:50%;background:#111111;color:#fff;border:2px solid rgba(34,197,94,.55);box-shadow:0 10px 24px rgba(9,14,10,.28),0 0 0 4px var(--glass-hi);display:flex;align-items:center;justify-content:center;margin:18px auto 12px;transition:transform .15s}
.msg-plus svg{width:24px;height:24px}
.msg-plus:active{transform:scale(.96)}
.msg-gate{text-align:center;padding:30px 22px;max-width:520px;margin-left:auto;margin-right:auto}
.msg-gate-ico{width:72px;height:72px;border-radius:50%;background:rgba(34,197,94,.12);color:var(--deep);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.msg-gate-ico svg{width:34px;height:34px}
.msg-gate-title{font-size:17px;font-weight:650;letter-spacing:-.01em;line-height:1.7;margin:0 0 8px}
.msg-gate-sub{font-size:13.5px;line-height:1.85;color:var(--muted);margin:0 auto;max-width:340px}
.msg-create-label{font-size:13px;font-weight:600;color:var(--ink2);text-align:center}
.msg-userchip{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.msg-atchip{display:inline-flex;align-items:center;gap:6px;background:var(--mint-glass);border:1px solid rgba(34,197,94,.30);color:var(--deep);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:650}
.msg-editbtn{margin-left:auto;background:var(--field-bg);border:1px solid var(--hair);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600}
.msg-atwrap{display:flex;align-items:center;background:var(--field-bg);border:1px solid var(--field-brd);border-radius:12px;overflow:hidden}
.msg-atwrap:focus-within{border-color:rgba(34,197,94,.5);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.msg-at{flex:none;padding:0 4px 0 13px;font-weight:650;color:var(--deep);font-size:14.5px}
.msg-atwrap input{flex:1;border:none!important;background:none!important;box-shadow:none!important;padding-left:2px!important}
.msg-hint{font-size:12.5px;line-height:1.7;margin-top:6px;color:var(--muted)}
.msg-hint.ok{color:var(--green);font-weight:600}
.msg-hint.err{color:#101410;font-weight:600}
.msg-search{display:flex;align-items:center;gap:9px;background:var(--glass-hi);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-brd);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--hair2);border-radius:999px;padding:11px 16px;color:var(--muted);margin-bottom:14px}
.msg-search svg{width:17px;height:17px;flex:none}
.msg-search input{border:none;background:none;outline:none;flex:1;font-size:14px;color:var(--ink);min-width:0}
.pavatar{flex:none;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--deep),var(--green));color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:650}
.pavatar.sm{width:36px;height:36px;font-size:14px}
.msgrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--hair);padding:12px 0;font-size:14px;text-align:left;color:inherit}
.msgrow:last-child{border-bottom:none}
.msgrow .tm{flex:1;min-width:0}
.msgrow .pn{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgrow .pu{font-size:12px;color:var(--muted);display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgrow .ptag{flex:none;font-size:10.5px;font-weight:650;color:var(--deep);background:var(--mint-glass);border-radius:999px;padding:3px 9px}
.msgrow .ptime{flex:none;font-size:11px;color:var(--muted)}
.msg-openbtn{flex:none;background:#111111;color:#fff;border:none;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600}
/* chat sub-view */
.chat-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.chat-back{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--hair);background:var(--field-bg);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.chat-back svg{width:17px;height:17px}
.chat-head .tm{flex:1;min-width:0}
.chat-head .pn{font-size:15px;font-weight:650;display:block}
.chat-head .pu{font-size:12px;color:var(--muted);display:block}
.chat-online{font-size:11px;color:var(--green);font-weight:600}
.sharepill{display:inline-flex;align-items:center;gap:7px;background:var(--field-bg);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(34,197,94,.35);color:var(--deep);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600;margin-bottom:10px}
.sharepill svg{width:15px;height:15px}
.bubbles{display:flex;flex-direction:column;gap:9px;padding:4px 0 12px}
.bub{max-width:80%;padding:10px 13px;font-size:14px;line-height:1.65;word-wrap:break-word;overflow-wrap:break-word}
.bub.them{align-self:flex-start;background:var(--glass-hi);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-brd);border-radius:18px 18px 18px 6px;box-shadow:var(--shadow-sm)}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--deep),var(--green));color:#fff;border-radius:18px 18px 6px 18px;box-shadow:0 8px 20px rgba(11,61,36,.20)}
.bub .btime{display:block;font-size:10px;margin-top:4px;opacity:.65;text-align:right}
.bub.cardmsg{background:linear-gradient(135deg,rgba(9,14,10,.94),rgba(11,61,36,.92));color:#fff;border-radius:18px;padding:13px 15px;min-width:210px}
.bub.cardmsg .ct{font-size:11px;letter-spacing:.05em;color:var(--green-xl);font-weight:700;margin-bottom:7px}
.bub.cardmsg .crow{display:flex;justify-content:space-between;gap:16px;font-size:13px;padding:3px 0}
.bub.cardmsg .crow span{color:var(--glass-hi)}
.bub.cardmsg .crow b{font-weight:650}
.chat-img{max-width:220px;width:100%;border-radius:12px;display:block}
.chat-vid{max-width:230px;width:100%;border-radius:12px;display:block}
.filecard{display:flex;align-items:center;gap:10px;min-width:180px}
.filecard .fic{flex:none;width:36px;height:36px;border-radius:10px;background:rgba(34,197,94,.14);color:var(--deep);display:flex;align-items:center;justify-content:center}
.bub.me .filecard .fic{background:rgba(255,255,255,.18);color:#fff}
.filecard .fic svg{width:18px;height:18px}
.filecard .fn{font-size:13px;font-weight:600;display:block;word-break:break-all}
.filecard .fs{font-size:11px;opacity:.7;display:block}
.attach-note{font-size:11px;color:var(--muted);line-height:1.7;margin-top:8px}
.composer{position:sticky;bottom:96px;z-index:40;display:flex;align-items:center;gap:8px;background:var(--glass-hi);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-brd);box-shadow:var(--shadow),inset 0 0 0 1px var(--hair2);border-radius:999px;padding:6px}
.composer .attachbtn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--hair);background:var(--field-bg);display:flex;align-items:center;justify-content:center;color:var(--deep)}
.composer .attachbtn svg{width:18px;height:18px}
.composer input[type=text]{flex:1;border:none;background:none;outline:none;font-size:14px;color:var(--ink);min-width:0;padding:8px 2px}
.composer .sendbtn{flex:none;width:38px;height:38px;border-radius:50%;border:none;background:#111111;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(9,14,10,.22)}
.composer .sendbtn svg{width:17px;height:17px}
@media (min-width:1024px){.composer{bottom:18px}}


/* ============ UI7 Message — two-pane / responsive layout ============ */
.msg-setup{max-width:520px;margin-left:auto;margin-right:auto}
.msg-layout{display:block}
.msg-right{display:none}
.msg-layout.chat-open .msg-left{display:none}
.msg-layout.chat-open .msg-right{display:block}
.msg-empty{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-brd);box-shadow:var(--shadow),inset 0 0 0 1px var(--hair2);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:300px;padding:28px 20px;color:var(--muted)}
.msg-empty p{font-size:14.5px;font-weight:550;margin:0}
.msg-empty .msg-gate-ico{margin:0 auto 14px}
@media (min-width:1024px){
  .msg-layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
  .msg-layout .msg-left{display:block!important}
  .msg-layout .msg-right{display:block!important}
  .msg-right .bubbles{max-height:54vh;overflow-y:auto;padding-right:4px}
  .msg-empty{min-height:430px}

  .center:has(> #page-message.active){max-width:1020px}
  #page-add .card,#page-accounts .card,#page-assets .card,#page-settings .card{max-width:640px}
}


/* ============ UI8 Dark Mode (CSS variables flip) ============ */
html[data-theme="dark"]{
  color-scheme:dark;
  --ink:#F2F5F2; --ink2:#D7E0D7; --muted:#9DB09D;
  --bg:#0A0E0A;
  --glass:rgba(22,30,22,.55); --glass-brd:rgba(255,255,255,.09);
  --glass-hi:rgba(28,38,28,.62); --glass-lo:rgba(24,32,24,.50); --glass-menu:rgba(18,26,18,.88);
  --field-bg:rgba(28,38,28,.55); --field-brd:rgba(255,255,255,.12);
  --keybg:rgba(28,38,28,.50); --keybrd:rgba(255,255,255,.10);
  --mint-glass:rgba(22,163,74,.20);
  --hair:rgba(255,255,255,.08); --hair2:rgba(255,255,255,.05);
  --gridline:rgba(255,255,255,.07); --track:rgba(255,255,255,.13);
  --shadow:0 12px 40px rgba(0,0,0,.45); --shadow-sm:0 4px 18px rgba(0,0,0,.35);
  --deep:#4ADE80; --exp-red:#F97066;
}
html[data-theme="dark"] .orb.o1{background:rgba(20,83,45,.13)}
html[data-theme="dark"] .orb.o2{background:rgba(34,197,94,.10)}
html[data-theme="dark"] .orb.o3{background:rgba(95,107,95,.08)}
/* primary CTAs: black is invisible on dark -> green in dark mode */
html[data-theme="dark"] .btn.primary,html[data-theme="dark"] .savebtn,
html[data-theme="dark"] .msg-openbtn,html[data-theme="dark"] .composer .sendbtn{
  background:var(--green);color:#fff;box-shadow:0 8px 22px rgba(22,163,74,.32)}
html[data-theme="dark"] .tabpill.active,html[data-theme="dark"] .chip.on{
  background:var(--green);border-color:var(--green);color:#fff}
html[data-theme="dark"] .toggle button.on{background:#F2F5F2;color:#101410;box-shadow:0 4px 14px rgba(0,0,0,.35)}
html[data-theme="dark"] .toggle #tg-income.on{background:var(--green);color:#fff}
html[data-theme="dark"] .plusbtn,html[data-theme="dark"] .msg-plus{
  box-shadow:0 10px 24px rgba(0,0,0,.5),0 0 0 4px rgba(255,255,255,.14)}
html[data-theme="dark"] .keypad button:active{background:rgba(22,163,74,.25)}
html[data-theme="dark"] .catcell.on{background:rgba(22,163,74,.18)}
html[data-theme="dark"] .side-nav button.active{background:rgba(22,163,74,.18);color:var(--green-xl)}
html[data-theme="dark"] .langopt.on,html[data-theme="dark"] .langopt:hover{background:rgba(22,163,74,.18)}
html[data-theme="dark"] .msg-hint.err{color:#F2F5F2}
html[data-theme="dark"] select option{background:#162016;color:#F2F5F2}
/* Settings theme switch */
.switch{flex:none;width:50px;height:29px;border-radius:999px;border:1px solid var(--hair);background:var(--glass-lo);position:relative;transition:background .2s;padding:0;cursor:pointer}
.switch .knob{position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:left .2s}
.switch.on{background:var(--green);border-color:var(--green)}
.switch.on .knob{left:23px}

  border-color:rgba(255,255,255,.09);box-shadow:0 18px 40px rgba(0,0,0,.45)}
/* Hero / right-rail dark card / member card / promo: deep emerald gradient + mint border + glow */
html[data-theme="dark"] .hero,html[data-theme="dark"] .rp-dark,html[data-theme="dark"] .membercard{
  background:linear-gradient(150deg,#0D2B1B,#081A10);border-color:rgba(74,222,128,.28);
  box-shadow:0 22px 48px rgba(0,0,0,.5),0 0 44px rgba(34,197,94,.12);color:#F4F8F4}
html[data-theme="dark"] .promo{background:linear-gradient(150deg,#0D2B1B,#081A10);border-color:rgba(74,222,128,.28)}
html[data-theme="dark"] .promo p{color:#B9C8BB}
/* Label text sitting on the emerald surfaces (was resolving to dark field colour) */
html[data-theme="dark"] .hero .lbl,html[data-theme="dark"] .hero-grid span,
html[data-theme="dark"] .rp-dark .lbl,html[data-theme="dark"] .rp-dark .rp-row span,
html[data-theme="dark"] .bub.cardmsg .crow span,html[data-theme="dark"] .membercard .ms{color:#B9C8BB}
/* Headings: crisp primary in dark */
html[data-theme="dark"] .sechead h2,html[data-theme="dark"] .deskhead h1,
html[data-theme="dark"] .totalhead,html[data-theme="dark"] .addform h3{color:#F4F8F4}
/* Main CTA: green gradient + glow */
html[data-theme="dark"] .btn.primary,html[data-theme="dark"] .savebtn,
html[data-theme="dark"] .msg-openbtn,html[data-theme="dark"] .composer .sendbtn{
  background:linear-gradient(135deg,#22C55E,#16A34A);color:#fff;box-shadow:0 10px 26px rgba(34,197,94,.28)}
html[data-theme="dark"] .plusbtn,html[data-theme="dark"] .msg-plus{
  background:linear-gradient(135deg,#22C55E,#16A34A);color:#fff;border-color:rgba(74,222,128,.55);
  box-shadow:0 12px 28px rgba(34,197,94,.30),0 0 0 4px rgba(255,255,255,.07)}
/* Selected nav / tabs / chips: green tint + bright green text */
html[data-theme="dark"] .tabpill.active,html[data-theme="dark"] .tabpill[data-nav].active{
  background:rgba(34,197,94,.18);border-color:rgba(74,222,128,.45);color:#4ADE80}
html[data-theme="dark"] .chip.on{background:rgba(34,197,94,.18);border-color:rgba(74,222,128,.45);color:#4ADE80}
html[data-theme="dark"] .side-nav button.active{background:rgba(34,197,94,.18);color:#4ADE80}
html[data-theme="dark"] .side-nav button.active svg{color:#4ADE80}
html[data-theme="dark"] .bn-in>button[data-nav].active{color:#4ADE80}
html[data-theme="dark"] .langopt.on,html[data-theme="dark"] .langopt:hover{background:rgba(34,197,94,.18);color:#4ADE80}
/* Sidebar / side-foot resting text */
html[data-theme="dark"] .side-nav button,html[data-theme="dark"] .side-foot button{color:#B9C8BB}
/* Toggle: keep UI10 treatment, token-aligned */
html[data-theme="dark"] .toggle{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.09)}
html[data-theme="dark"] .toggle button.on{background:#F4F8F4;color:#101410;box-shadow:0 4px 14px rgba(0,0,0,.35)}
html[data-theme="dark"] .toggle #tg-income.on{background:linear-gradient(135deg,#22C55E,#16A34A);color:#fff}
/* Inputs / selects / search fields */
html[data-theme="dark"] .field input,html[data-theme="dark"] .field select,html[data-theme="dark"] .msg-atwrap,
html[data-theme="dark"] .mnbtn{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.10);color:#F4F8F4}
html[data-theme="dark"] input::placeholder{color:rgba(244,248,244,.35)}
html[data-theme="dark"] select option{background:#0C130D;color:#F4F8F4}
/* Keypad circles: card-gradient glass (geometry unchanged) */
html[data-theme="dark"] .keypad button{
  background:linear-gradient(165deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border-color:rgba(255,255,255,.10);color:#F4F8F4}
html[data-theme="dark"] .keypad button.kp-fn{color:#8CA08D}
@media (hover:hover) and (pointer:fine){html[data-theme="dark"] .keypad button:hover{background:rgba(255,255,255,.10)}}
html[data-theme="dark"] .keypad button:active{background:rgba(34,197,94,.25)}
/* Category tiles: card glass; selected = mint border + green tint */
html[data-theme="dark"] .catcell{
  background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.025));
  border-color:rgba(255,255,255,.09);color:#B9C8BB}
html[data-theme="dark"] .catcell.on{background:rgba(34,197,94,.16);border-color:rgba(74,222,128,.45);color:#F4F8F4}
/* Small glass buttons / pills / chips (resting) */
html[data-theme="dark"] .icobtn,html[data-theme="dark"] .editbtn,html[data-theme="dark"] .chat-back,
html[data-theme="dark"] .delbtn,html[data-theme="dark"] .sharepill,html[data-theme="dark"] .langbtn,
html[data-theme="dark"] .msg-editbtn,html[data-theme="dark"] .composer .attachbtn,html[data-theme="dark"] .btn.glassb{
  background:linear-gradient(165deg,rgba(255,255,255,.08),rgba(255,255,255,.035));

html[data-theme="dark"] .tabpill{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.09);color:#B9C8BB}

html[data-theme="dark"] .sharepill{color:#4ADE80}

html[data-theme="dark"] .bub.them{

/* Misc surfaces into the same system */
html[data-theme="dark"] .phone-mock{
  background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border-color:rgba(255,255,255,.09)}
html[data-theme="dark"] .switch{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.10)}

html[data-theme="dark"] .msg-hint.err{color:#F4F8F4}
/* Charts in dark: income bars bright emerald gradient (expense stays --exp-red #F97066) */
html[data-theme="dark"] .bpair i.inc{background:linear-gradient(180deg,#4ADE80,#22C55E)}
html[data-theme="dark"] .pm-bar-row i{background:linear-gradient(180deg,#4ADE80,#22C55E)}

/* ============ UI10: expense red + dialer keypad zones + monthly summary + brand tiles ============ */
.expv{color:var(--exp-red)}
#h-spend{color:var(--exp-red)}
#t-top .pbar i{background:var(--exp-red)}
.addcard.exp-mode .amountbig{color:var(--exp-red)}
.addcard.exp-mode .amountsub{color:var(--exp-red)}
.addcard.exp-mode .savebtn{background:var(--exp-red);color:#fff}
.add-left,.add-right{display:contents}
@media (min-width:1024px){
  #page-add .card{max-width:920px}
  .addcard{display:grid;grid-template-columns:minmax(0,1fr) 300px;column-gap:30px;align-items:center}
  .add-left{display:flex;flex-direction:column;min-width:0}
  .add-right{display:flex;flex-direction:column;align-items:center;min-width:0}
  .addcard .keypad{margin-top:0}
  .add-right .savebtn{margin-top:16px}
}
.mnav{display:inline-flex;align-items:center;gap:8px}
.mnbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--hair);background:var(--field-bg);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.mtitle{font-size:13.5px;font-weight:650;min-width:118px;text-align:center}
.mstrip{margin-top:6px}
.mrow{display:block;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--hair);padding:10px 8px;border-radius:10px;cursor:pointer;color:inherit}
.mrow.on{background:var(--mint-glass)}
.mrow-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mrow .mn{font-size:13.5px;font-weight:600}
.mrow .ml{font-size:13.5px;font-weight:650}
.mrow-sub{display:flex;gap:14px;font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.rp-nm{display:inline-flex;align-items:center;gap:8px}
.brand-tile{flex:none;width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;line-height:1;letter-spacing:.01em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);color:#fff}
.brand-tile.sm{width:26px;height:26px;border-radius:8px;font-size:7.5px}
.brand-tile.neutral{background:var(--glass-lo);color:var(--deep);box-shadow:inset 0 0 0 1px var(--hair2)}
.brand-tile.neutral svg{width:17px;height:17px}
.brand-tile.logo{background:#fff;padding:0;overflow:hidden}
.brand-tile.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brandgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:2px}
.brandpick{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 7px;border-radius:14px;border:1px solid var(--hair2);background:var(--glass-lo);font-size:10.5px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit}
.brandpick .brand-tile{width:44px;height:44px;border-radius:12px;font-size:11.5px}
.brandpick .brand-tile.neutral svg{width:20px;height:20px}
.brandpick.on{border-color:rgba(34,197,94,.55);background:var(--mint-glass);box-shadow:0 0 0 1px rgba(34,197,94,.25)}
/* ============ UI12 Support chat ============ */
.sup-wrap{max-width:760px;margin:0 auto}
.sup-avatar{position:relative;flex:none;width:42px;height:42px;border-radius:12px;background:#111111;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.sup-avatar img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.sup-dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:#22C55E;border:2px solid #fff}
html[data-theme="dark"] .sup-dot{border-color:#0A100C}
.sup-shield{margin-left:auto;flex:none;color:var(--deep);display:flex;align-items:center}
.sup-shield svg{width:20px;height:20px}
.daydiv{display:flex;justify-content:center;margin:2px 0 10px}
.daydiv span{font-size:11px;color:var(--muted);background:var(--glass-lo);border:1px solid var(--hair2);padding:3px 11px;border-radius:999px}

function fmtDateISO(iso){ var a=String(iso||'').split('-'); if(a.length!==3) return String(iso||''); var d=new Date(+a[0], (+a[1])-1, +a[2]); return fmtDateObj(d, {day:'numeric', month:'short', year:'numeric'}); }

function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthDateISO(offset){ var d=new Date(); var dd=d.getDate(); var t=new Date(d.getFullYear(), d.getMonth()-offset, 1); var last=new Date(t.getFullYear(), t.getMonth()+1, 0).getDate(); var day=Math.min(dd,last); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'); }
function monthPrefix(){ return todayISO().slice(0,7); }
function prevPrefix(p){ var a=p.split('-'), y=+a[0], m=+a[1]-1; if(m===0){m=12;y--;} return y+'-'+String(m).padStart(2,'0'); }

var BRANDS = [
  {key:'kbzpay', name:'KBZ Pay', type:'ewallet', mark:'KPay'},
  {key:'wave', name:'Wave Money', type:'ewallet', mark:'Wave'},
  {key:'ayapay', name:'AYA Pay', type:'ewallet', mark:'AYA'},
  {key:'cbpay', name:'CB Pay', type:'ewallet', mark:'CB'},
  {key:'mytelpay', name:'MytelPay', type:'ewallet', mark:'Mytel'},
  {key:'kbzbank', name:'KBZ Bank', type:'bank', mark:'KBZ'},
  {key:'ayabank', name:'AYA Bank', type:'bank', mark:'AYA'},
  {key:'cbbank', name:'CB Bank', type:'bank', mark:'CB'},
  {key:'yoma', name:'Yoma Bank', type:'bank', mark:'Yoma'}
];
var selBrand = '';
function brandByKey(k){ for(var i=0;i<BRANDS.length;i++) if(BRANDS[i].key===k) return BRANDS[i]; return null; }
function brandFor(r){
  if(!r) return null;
  if(r.brand){ var b = brandByKey(r.brand); if(b) return b; if(r.brand==='cash') return {key:'cash', name:'Cash', type:'cash', mark:''}; }
  var n = String(r.name||'').toLowerCase();
  for(var i=0;i<BRANDS.length;i++){ var bn = BRANDS[i].name.toLowerCase(); if(n===bn || n.indexOf(bn+' ')===0 || n.indexOf(bn+'-')===0) return BRANDS[i]; }
  if(n==='cash') return {key:'cash', name:'Cash', type:'cash', mark:''};
  return null;
}
function brandTile(r, cls){
  var b = brandFor(r);
  if(!b) return '<span class="chip-ico">'+typeIcon(r.type)+'</span>';
  if(b.key==='cash') return '<span class="brand-tile neutral '+(cls||'')+'">'+svgI(P.note)+'</span>';
  return '<span class="brand-tile logo bt-'+b.key+' '+(cls||'')+'"><img src="'+BRAND_LOGOS[b.key]+'" alt="'+esc(b.name)+'"></span>';
}
function renderBrandPicker(){
  var items = BRANDS.map(function(b){ return {key:b.key, name:b.name}; });
  items.push({key:'cash', name:'Cash'});
  items.push({key:'other', name:t('cat_other')});
  el('ac-brandgrid').innerHTML = items.map(function(it){
    var tile;
    if(it.key==='cash') tile = '<span class="brand-tile neutral">'+svgI(P.note)+'</span>';
    else if(it.key==='other') tile = '<span class="brand-tile neutral">'+svgI(P.dots)+'</span>';
    else { var b = brandByKey(it.key); tile = '<span class="brand-tile logo bt-'+b.key+'"><img src="'+BRAND_LOGOS[b.key]+'" alt="'+esc(b.name)+'"></span>'; }
    return '<button type="button" class="brandpick'+(selBrand===it.key?' on':'')+'" onclick="pickBrand(\''+it.key+'\')">'+tile+'<span>'+esc(it.name)+'</span></button>';
  }).join('');
}
function pickBrand(key){
  if(key==='other'){ selBrand=''; renderBrandPicker(); return; }
  selBrand = key;
  if(key==='cash'){ el('ac-name-in').value = 'Cash'; el('ac-type-in').value = 'cash'; }
  else { var b = brandByKey(key); if(b){ el('ac-name-in').value = b.name; el('ac-type-in').value = b.type; } }
  renderBrandPicker();
}

var DUMMY = {textContent:'', innerHTML:'', value:'', style:{}, classList:{add:function(){}, remove:function(){}, toggle:function(){}}, setAttribute:function(){}, getAttribute:function(){ return null; }};
function el(id){ try{ var e=document.getElementById(id); return e||DUMMY; }catch(e){ return DUMMY; } }
function all(sel){ try{ return Array.prototype.slice.call(document.querySelectorAll(sel)); }catch(e){ return []; } }

/* ================= i18n rendering ================= */
function applyLang(){
  var L = lang();
  try{ document.documentElement.setAttribute('lang', LOCALES[L]); }catch(e){}
  try{
    var b = document.body;
    if(b && b.classList){ ['lang-en','lang-my','lang-zh','lang-th'].forEach(function(c){ b.classList.remove(c); }); b.classList.add('lang-'+L); }
  }catch(e){}
  el('lang-cur-m').textContent = LANG_NATIVE[L];
  el('lang-cur-d').textContent = LANG_NATIVE[L];
  renderStatic(); renderLangMenus(); renderSettingsLang();
}
function renderStatic(){
  all('[data-i18n]').forEach(function(e){ var k=e.getAttribute('data-i18n'); if(k) e.textContent = t(k); });
  all('[data-i18n-ph]').forEach(function(e){ var k=e.getAttribute('data-i18n-ph'); if(k) e.setAttribute('placeholder', t(k)); });
  all('[data-i18n-aria]').forEach(function(e){ var k=e.getAttribute('data-i18n-aria'); if(k) e.setAttribute('aria-label', t(k)); });
  el('settings-help-title').textContent = t('help_support') + ' / ' + t('about');
  el('d-title').textContent = t(TITLE_KEY[curPage] || 'nav_dashboard');
  setSelectLabels('ac-type-in', [['cash','type_cash'],['bank','type_bank'],['ewallet','type_ewallet'],['savings','type_savings']]);
  setSelectLabels('as-type-in', [['House','type_house'],['Land','type_land'],['Condo','type_condo'],['Gold','type_gold'],['Other','cat_other']]);
  var tt = el('add-title'); if(tt!==DUMMY) tt.textContent = addState.kind==='income' ? t('add_income') : t('add_expense');
  var sv = el('add-save'); if(sv!==DUMMY) sv.textContent = addState.kind==='income' ? t('add_income') : t('add_expense');
}
function setSelectLabels(id, pairs){
  var sel = el(id); if(sel===DUMMY || !sel.options) return;
  pairs.forEach(function(pr, i){ var o = sel.options[i]; if(o) o.textContent = t(pr[1]); });
}
function langMenuHTML(){
  return LANG_ORDER.map(function(L){
    return '<button class="langopt'+(L===lang()?' on':'')+'" onclick="setLang(\''+L+'\')"><span>'+esc(LANG_NATIVE[L])+'</span>'+(L===lang()?'<span class="langcheck">'+svgI(P.check)+'</span>':'')+'</button>';
  }).join('');
}
function renderLangMenus(){
  var h = langMenuHTML();
  el('langmenu-m').innerHTML = h;
  el('langmenu-d').innerHTML = h;
}
function renderSettingsLang(){
  el('settings-lang').innerHTML = LANG_ORDER.map(function(L){
    return '<button class="langrow'+(L===lang()?' on':'')+'" onclick="setLang(\''+L+'\')"><span class="langrow-ico">'+svgI(P.globe)+'</span><span class="langrow-name">'+esc(LANG_NATIVE[L])+'</span>'+(L===lang()?'<span class="langcheck">'+svgI(P.check)+'</span>':'')+'</button>';
  }).join('');
}
function toggleLangMenu(which){
  var m = el('langmenu-'+which), other = el('langmenu-'+(which==='m'?'d':'m'));
  var open = m.classList && m.classList.toggle ? false : false;
  var isOpen = m.style && m.style.display==='block';
  if(other!==DUMMY && other.style) other.style.display='none';
  if(m!==DUMMY && m.style) m.style.display = isOpen ? 'none' : 'block';
}
function closeLangMenus(){ ['langmenu-m','langmenu-d'].forEach(function(id){ var m=el(id); if(m!==DUMMY && m.style) m.style.display='none'; }); }
function setLang(L){
  if(!STRINGS[L]) return;
  state.lang = L; save(state);
  closeLangMenus();
  applyLang(); renderAll();
}

function totals(){
  var accounts = state.accounts.reduce(function(a,r){ return a+Number(r.balance||0); },0);
  var assets = state.assets.reduce(function(a,r){ return a+Number(r.current_value||0); },0);
  var debts = state.debts.reduce(function(a,r){ return a+Number(r.amount||0); },0);
  var mt = monthTotals(monthPrefix());
  return {accounts:accounts, assets:assets, debts:debts,
    netWorth: accounts + assets - debts,
    income:mt.income, expense:mt.expense, leftover:mt.income-mt.expense};
}
function monthTotals(prefix){
  var inc=0, exp=0;
  state.transactions.forEach(function(r){ if((r.txn_date||'').slice(0,7)===prefix){ if(r.kind==='income') inc+=Number(r.amount||0); else exp+=Number(r.amount||0); } });
  return {income:inc, expense:exp, leftover:inc-exp};
}
function expenseByCategory(prefix){
  var by={};
  state.transactions.forEach(function(r){ if(r.kind==='expense' && (r.txn_date||'').slice(0,7)===prefix){ by[r.category]=(by[r.category]||0)+Number(r.amount||0); } });
  return Object.keys(by).map(function(k){ return {cat:k, amount:by[k]}; }).sort(function(a,b){ return b.amount-a.amount; });
}
function nextPrefix(p){ var a=p.split('-'), y=+a[0], m=+a[1]+1; if(m===13){m=1;y++;} return y+'-'+String(m).padStart(2,'0'); }

function flash(msg){
  var f=el('flash'); f.textContent=msg; f.style.display='block';
  setTimeout(function(){ f.style.display='none'; }, 2600);
  try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(e){}
}
function go(page){
  curPage = page; closeLangMenus();
  try{ document.body.classList.toggle('on-add', page==='add'); }catch(e){}
  all('.page').forEach(function(p){ p.classList.remove('active'); });
  var target=el('page-'+page); if(target!==DUMMY) target.classList.add('active');
  all('[data-nav]').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-nav')===page); });
  el('d-title').textContent = t(TITLE_KEY[page]||'nav_dashboard');
  renderAll();
  try{ window.scrollTo(0,0); }catch(e){}
}
function setSearch(v){ uiSearch = String(v||'').toLowerCase(); if(uiSearch) goSoft('activity'); renderActivity(); }
function goSoft(page){
  curPage = page;
  try{ document.body.classList.toggle('on-add', page==='add'); }catch(e){}
  all('.page').forEach(function(p){ p.classList.remove('active'); });
  var target=el('page-'+page); if(target!==DUMMY) target.classList.add('active');
  all('[data-nav]').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-nav')===page); });
  el('d-title').textContent = t(TITLE_KEY[page]||'nav_dashboard');
}
function delItem(kind, id){
  if(!confirm(t('delete_confirm'))) return;
  state[kind] = state[kind].filter(function(r){ return r.id!==id; });
  save(state); renderAll(); flash(t('deleted'));
}
function delBtn(kind, id){ return '<button class="delbtn" title="'+esc(t('delete_label'))+'" aria-label="'+esc(t('delete_label'))+'" onclick="delItem(\''+kind+'\','+id+')">'+svgI('<path d="M6 6l12 12M18 6L6 18"/>')+'</button>'; }
function txnRow(r, withDel){
  return '<div class="txn"><span class="chip-ico">'+iconFor(r.category)+'</span>'+
    '<span class="tm"><span class="tn">'+esc(catLabel(r.category))+(r.note?' · '+esc(r.note):'')+'</span><div class="td">'+esc(fmtDateISO(r.txn_date))+'</div></span>'+
    '<span class="ta '+r.kind+'">'+(r.kind==='income'?'+':'−')+mmk(r.amount)+'</span>'+(withDel?delBtn('transactions', r.id):'')+'</div>';
}
function sortedTxns(){
  return state.transactions.slice().sort(function(a,b){ return (b.txn_date||'').localeCompare(a.txn_date||'') || b.id-a.id; });
}

function renderHome(){
  var tt=totals();
  el('h-dateline').innerHTML = '<b>'+esc(fmtDateObj(new Date(), {weekday:'short', day:'numeric', month:'short', year:'numeric'}))+'</b>';
  el('h-spend').textContent = mmk(tt.expense);
  var prev = monthTotals(prevPrefix(monthPrefix()));
  if(prev.expense>0){
    var diff = (prev.expense - tt.expense)/prev.expense*100;
    el('h-vs').innerHTML = '<b>'+esc(t(diff>=0?'vs_below':'vs_above').replace('{v}', Math.abs(diff).toFixed(0)))+'</b>';
  } else {
    el('h-vs').textContent = t('first_month');
  }
  el('h-networth').textContent = mmk(tt.netWorth);
  el('h-b-accounts').textContent = mmk(tt.accounts);
  el('h-b-assets').textContent = mmk(tt.assets);
  el('h-b-debts').textContent = '−'+mmk(tt.debts);
  el('h-income').textContent = mmk(tt.income);
  el('h-leftover').textContent = mmk(tt.leftover);
  el('h-expense').textContent = mmk(tt.expense);
  el('h-accounts').textContent = mmk(tt.accounts);
  var w = '<div class="wrow total"><span class="chip-ico dk">'+svgI(P.wallet)+'</span><span class="tm"><span class="tn">'+esc(t('spending_wallet'))+'</span><div class="td">'+esc(t('wallet_total_sub'))+'</div></span><span class="wv">'+mmk(tt.accounts)+'</span></div>';
  w += state.accounts.map(function(r){ return '<div class="wrow">'+brandTile(r)+'<span class="tm"><span class="tn">'+esc(r.name)+'</span><div class="td">'+esc(accTypeLabel(r.type))+(r.note?' · '+esc(r.note):'')+'</div></span><span class="wv">'+mmk(r.balance)+'</span></div>'; }).join('');
  el('h-wallets').innerHTML = w;
  var recent = sortedTxns().slice(0,6);
  el('h-recent').innerHTML = recent.length ? recent.map(function(r){ return txnRow(r,false); }).join('') : '<p class="muted">'+esc(t('no_transactions_yet'))+'</p>';
  el('r-networth').textContent = mmk(tt.netWorth);
  el('r-accounts-v').textContent = mmk(tt.accounts);
  el('r-assets-v').textContent = mmk(tt.assets);
  el('r-debts-v').textContent = '−'+mmk(tt.debts);
  el('r-accounts').innerHTML = state.accounts.length ? state.accounts.map(function(r){ return '<div class="rp-row"><span class="rp-nm">'+brandTile(r,'sm')+esc(r.name)+' <small>'+esc(accTypeLabel(r.type))+'</small></span><b>'+mmk(r.balance)+'</b></div>'; }).join('') : '<p class="muted">'+esc(t('no_accounts'))+'</p>';
}

function renderActivity(){
  var tt = totals();
  var prefix = monthPrefix();

function addKeyHandler(ev){
  if(curPage!=='add') return;
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  var ae = document.activeElement, tag = ae ? ae.tagName : '';
  var inField = !!(ae && (tag==='TEXTAREA' || tag==='SELECT' || (tag==='INPUT' && ae.type!=='button' && ae.type!=='checkbox')));
  if(inField){
    if(ev.key==='Enter' && ae.id==='add-note'){ ev.preventDefault(); saveAdd(); }
    return;
  }
  if(ev.key.length===1 && ev.key>='0' && ev.key<='9'){ keyPress(ev.key); ev.preventDefault(); }
  else if(ev.key==='Backspace'){ keyPress('back'); ev.preventDefault(); }
  else if(ev.key==='Enter'){ ev.preventDefault(); saveAdd(); }
}

  cs=cs.slice().sort(function(a,b){ return (b.messages[b.messages.length-1].time||'').localeCompare(a.messages[a.messages.length-1].time||''); });
  box.innerHTML = '<div class="lbl" style="margin:2px 2px 2px">'+esc(t('msg_conversations'))+'</div>'+
    (cs.length ? cs.map(function(c){
      var p=personBy(c.username)||{name:c.username, username:c.username};
      var last=c.messages[c.messages.length-1];
      return '<button class="msgrow" onclick="openChat(\''+c.username+'\')"><span class="pavatar">'+esc(p.name.slice(0,1).toUpperCase())+'</span>'+
        '<span class="tm"><span class="pn">'+esc(p.name)+'</span><span class="pu">'+esc(lastPreview(c))+'</span></span>'+
        '<span class="ptime">'+esc(last.time||'')+'</span></button>';
    }).join('') : '<p class="muted" style="margin:8px 2px">'+esc(t('msg_no_chats'))+'</p>');
}
function openChat(u){
  ensureConv(u);
  msgChatUser=u; msgView='chat';
  if(curPage!=='message'){ go('message'); } else { renderMessage(); }
}
function msgBack(){ msgView='home'; msgChatUser=''; renderMessage(); }
function maybeDemoReply(conv){
  if(conv.replied) return;
  conv.replied=true; save(state);
  var u=conv.username;
  setTimeout(function(){
    var c=convBy(u); if(!c) return;
    c.messages.push({from:'them', type:'text', text:t('msg_demo_reply'), time:nowTime()});
    save(state);
    if(curPage==='message') renderMessage();
  }, 1000);
}
function sendMsg(){
  var inp=el('chat-input'); var v=(inp.value||'').trim(); if(!v) return;
  var conv=ensureConv(msgChatUser);
  conv.messages.push({from:'me', type:'text', text:v, time:nowTime()});
  save(state);
  if(inp!==DUMMY) inp.value='';
  renderMessage();
  maybeDemoReply(conv);
}
function chatKey(ev){ if(ev && ev.key==='Enter'){ ev.preventDefault(); sendMsg(); } }
function todayTotals(){
  var td=todayISO(), inc=0, exp=0;
  state.transactions.forEach(function(r){ if(r.txn_date===td){ if(r.kind==='income') inc+=Number(r.amount||0); else exp+=Number(r.amount||0); } });
  return {income:inc, expense:exp, leftover:inc-exp};
}
function shareCosts(){
  var conv=ensureConv(msgChatUser);
  var tt=todayTotals();
  conv.messages.push({from:'me', type:'card', income:tt.income, expense:tt.expense, leftover:tt.leftover, txn_date:todayISO(), time:nowTime()});
  save(state);
  renderMessage();
  maybeDemoReply(conv);
}
function fmtBytes(n){
  n=Number(n||0);
  if(n<1024) return n+' B';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB';
  return (n/(1024*1024)).toFixed(1)+' MB';
}
function triggerAttach(){ var f=el('chat-file'); try{ if(f!==DUMMY && f.click) f.click(); }catch(e){} }
function onAttach(input){
  var file = input && input.files && input.files[0]; if(!file) return;
  addAttachment(file);
  try{ input.value=''; }catch(e){}
}
function addAttachment(file){
  var kind='file';
  if(file.type && file.type.indexOf('image/')===0) kind='image';
  else if(file.type && file.type.indexOf('video/')===0) kind='video';
  var url='';
  if(kind!=='file'){ try{ url=URL.createObjectURL(file); }catch(e){ url=''; } }
  var conv=ensureConv(msgChatUser);
  conv.messages.push({from:'me', type:kind, name:file.name||'file', size:file.size||0, url:url, time:nowTime()});
  save(state);
  renderMessage();
  maybeDemoReply(conv);
}
function msgBody(m){
  if(m.type==='text') return esc(m.text);
  if(m.type==='card'){
    return '<div class="ct">'+esc(t('msg_today_costs'))+' · '+esc(fmtDateISO(m.txn_date))+'</div>'+
      '<div class="crow"><span>'+esc(t('income'))+'</span><b>'+mmk(m.income)+'</b></div>'+
      '<div class="crow"><span>'+esc(t('expenses'))+'</span><b class="expv">'+mmk(m.expense)+'</b></div>'+
      '<div class="crow"><span>'+esc(t('leftover'))+'</span><b>'+mmk(m.leftover)+'</b></div>';
  }
  if((m.type==='image'||m.type==='video') && m.url){
    if(m.type==='image') return '<img class="chat-img" src="'+esc(m.url)+'" alt="'+esc(m.name||'')+'">';
    return '<video class="chat-vid" controls src="'+esc(m.url)+'"></video>';
  }
  var note = (m.type==='image'||m.type==='video') ? '<span class="fs">'+esc(t('msg_attach_session'))+'</span>' : '';
  return '<span class="filecard"><span class="fic">'+svgI(MSG_ICONS.file)+'</span><span class="tm"><span class="fn">'+esc(m.name||t('msg_file_label'))+'</span><span class="fs">'+esc(t('msg_file_label'))+' · '+esc(fmtBytes(m.size))+'</span>'+note+'</span></span>';
}
function bubbleHTML(m){
  var cls = m.type==='card' ? 'bub me cardmsg' : ('bub '+(m.from==='me'?'me':'them'));
  return '<div class="'+cls+'">'+msgBody(m)+'<span class="btime">'+esc(m.time||'')+'</span></div>';
}
function renderMessage(){
  var root=el('msg-root'); if(root===DUMMY) return;
  /* STATE A — gate */
  if(!state.myUsername && msgView!=='setup'){
    root.innerHTML =
      '<div class="card msg-gate">'+
        '<span class="msg-gate-ico">'+svgI(MSG_ICONS.chat)+'</span>'+
        '<h3 class="msg-gate-title">'+esc(t('msg_need_username'))+'</h3>'+
        '<p class="msg-gate-sub">'+esc(t('msg_gate_sub'))+'</p>'+
        '<button class="msg-plus" onclick="msgShowSetup()" aria-label="'+esc(t('msg_create_username'))+'">'+svgI('<path d="M12 5v14M5 12h14"/>')+'</button>'+
        '<div class="msg-create-label">'+esc(t('msg_create_username'))+'</div>'+
      '</div>';
    return;
  }
  /* Username setup / edit form */
  if(msgView==='setup'){
    var cur=state.myUsername||'';
    var dn=state.myDisplay||((state.profile?(state.profile.first+' '+state.profile.last).trim():'')||'');
    root.innerHTML =
      '<div class="card msg-setup">'+
        '<div class="lbl" style="margin-bottom:6px">'+esc(t(cur?'msg_edit_username':'msg_create_username'))+'</div>'+
        '<form onsubmit="return saveUsername(event)">'+
          '<div class="field"><label>'+esc(t('msg_username_label'))+'</label>'+
            '<div class="msg-atwrap"><span class="msg-at">@</span><input id="mu-name" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="'+esc(t('msg_username_ph'))+'" value="'+esc(cur)+'" oninput="msgUserCheck()"></div>'+
            '<div class="msg-hint" id="mu-hint">'+esc(t('msg_username_hint'))+'</div></div>'+
          '<div class="field"><label>'+esc(t('msg_display_name'))+' ('+esc(t('optional_word'))+')</label><input id="mu-display" type="text" value="'+esc(cur?dn:'')+'" placeholder="'+esc((state.profile?state.profile.first+' '+state.profile.last:'').trim())+'"></div>'+
          '<button class="btn primary" type="submit" style="width:100%">'+esc(t(cur?'msg_save_username':'msg_create_username'))+'</button>'+
        '</form>'+
        (cur?'<button class="btn glassb" style="width:100%;margin-top:10px" onclick="msgCancelSetup()">'+esc(t('msg_back'))+'</button>':'')+
      '</div>';
    msgUserCheck();
    return;
  }
  /* MAIN — two-pane on desktop, single-pane on mobile */
  var left =
    '<div class="card" style="padding:13px 16px"><div class="msg-userchip"><span class="lbl">'+esc(t('msg_your_username'))+'</span>'+
      '<span class="msg-atchip">@'+esc(state.myUsername)+'</span>'+
      (state.myDisplay?'<span class="muted" style="font-size:12.5px">'+esc(state.myDisplay)+'</span>':'')+
      '<button class="msg-editbtn" onclick="msgShowSetup()">'+esc(t('edit'))+'</button></div></div>'+
    '<div class="msg-search">'+svgI(MSG_ICONS.search)+'<input type="text" id="msg-search-in" placeholder="'+esc(t('msg_search_ph'))+'" value="'+esc(msgSearch)+'" oninput="msgSetSearch(this.value)"></div>'+
    '<div class="listcard"><div id="msg-convs"></div></div>'+
    '<div class="listcard"><div id="msg-results"></div></div>'+
    '';
  var right = '';
  if(msgView==='chat' && msgChatUser){
    var p2=personBy(msgChatUser)||{name:msgChatUser, username:msgChatUser, tag:''};
    var conv2=ensureConv(msgChatUser);
    right =
      '<div class="chat-head"><button class="chat-back" onclick="msgBack()" aria-label="'+esc(t('msg_back'))+'">'+svgI(MSG_ICONS.back)+'</button>'+
        '<span class="pavatar">'+esc(p2.name.slice(0,1).toUpperCase())+'</span>'+
        '<span class="tm"><span class="pn">'+esc(p2.name)+'</span><span class="pu">@'+esc(p2.username)+' · <span class="chat-online">'+esc(t('msg_online'))+'</span></span></span></div>'+
      '<button class="sharepill" onclick="shareCosts()">'+svgI(MSG_ICONS.share)+esc(t('msg_share_cost'))+'</button>'+
      '<div class="bubbles" id="chat-msgs">'+conv2.messages.map(bubbleHTML).join('')+'</div>'+
      '<div class="composer">'+
        '<button class="attachbtn" onclick="triggerAttach()" aria-label="'+esc(t('msg_attach'))+'">'+svgI(MSG_ICONS.clip)+'</button>'+
        '<input type="file" id="chat-file" style="display:none" accept="image/*,video/*,.pdf,.doc,.docx,.txt,.zip" onchange="onAttach(this)">'+
        '<input type="text" id="chat-input" placeholder="'+esc(t('msg_type_ph'))+'" onkeydown="chatKey(event)">'+
        '<button class="sendbtn" onclick="sendMsg()" aria-label="'+esc(t('msg_send'))+'">'+svgI(MSG_ICONS.send)+'</button>'+
      '</div>'+
      '<div class="attach-note">'+esc(t('msg_attach_note'))+'</div>';
  } else {
    right = '<div class="msg-empty"><span class="msg-gate-ico">'+svgI(MSG_ICONS.chat)+'</span><p>'+esc(t('msg_select_chat'))+'</p></div>';
  }
  root.innerHTML = '<div class="msg-layout'+(msgView==='chat'&&msgChatUser?' chat-open':'')+'"><div class="msg-left">'+left+'</div><div class="msg-right">'+right+'</div></div>';
  renderConvs();
  renderPeople();
  if(msgView==='chat'){ try{ var b=el('chat-msgs'); if(b!==DUMMY && b.scrollTop!==undefined) b.scrollTop=999999; }catch(e){} }
  return;
}
function renderSettingsMsg(){
  var box=el('settings-msg'); if(box===DUMMY) return;
  if(state.myUsername){
    box.innerHTML='<div class="rowbet"><span style="font-size:14px"><span class="muted">'+esc(t('msg_your_username'))+': </span><b>@'+esc(state.myUsername)+'</b></span><button class="msg-editbtn" onclick="msgShowSetup()">'+esc(t('edit'))+'</button></div>';
  } else {
    box.innerHTML='<div class="rowbet"><span class="muted" style="font-size:13.5px">'+esc(t('msg_need_username'))+'</span><button class="msg-openbtn" onclick="goMessage();msgShowSetup()">'+esc(t('msg_create_username'))+'</button></div>';
  }
}

/* ================= UI12 Support chat (user <-> admin) ================= */
function ensureSupport(){ if(!state.support || !state.support.messages) state.support = {replied:false, messages:[]}; return state.support; }
function renderSupport(){
  var sup = ensureSupport();
  var dEl = el('sup-date'); if(dEl !== DUMMY) dEl.textContent = fmtDateObj(new Date(), {weekday:'short', day:'numeric', month:'short', year:'numeric'});
  try{ var li = document.querySelector('.logo-tile img'); var si = el('sup-logo'); if(li && si !== DUMMY && li.getAttribute('src')) si.setAttribute('src', li.getAttribute('src')); }catch(e){}
  var box = el('sup-msgs'); if(box === DUMMY) return;
  var greet = {from:'them', type:'text', text:t('support_greeting'), time:''};
  box.innerHTML = [greet].concat(sup.messages).map(bubbleHTML).join('');
}
function supMaybeReply(){
  var sup = ensureSupport(); if(sup.replied) return;
  sup.replied = true; save(state);
  setTimeout(function(){
    var s2 = ensureSupport();
    s2.messages.push({from:'them', type:'text', text:t('support_reply'), time:nowTime()});
    save(state);
    if(curPage === 'support') renderSupport();
  }, 1000);
}
function sendSupport(){
  var inp = el('sup-input'); var v = (inp.value || '').trim(); if(!v) return;
  var sup = ensureSupport();
  sup.messages.push({from:'me', type:'text', text:v, time:nowTime()});
  save(state);
  if(inp !== DUMMY) inp.value = '';
  renderSupport(); supMaybeReply();
}
function supKey(ev){ if(ev && ev.key === 'Enter'){ ev.preventDefault(); sendSupport(); } }
function triggerSupAttach(){ var f = el('sup-file'); try{ if(f !== DUMMY && f.click) f.click(); }catch(e){} }
function onSupAttach(input){
  var file = input && input.files && input.files[0]; if(!file) return;
  addSupportAttachment(file);
  try{ input.value = ''; }catch(e){}
}
function addSupportAttachment(file){
  var kind = 'file';
  if(file.type && file.type.indexOf('image/') === 0) kind = 'image';
  else if(file.type && file.type.indexOf('video/') === 0) kind = 'video';
  var url = '';
  if(kind !== 'file'){ try{ url = URL.createObjectURL(file); }catch(e){ url = ''; } }
  var sup = ensureSupport();
  sup.messages.push({from:'me', type:kind, name:file.name || 'file', size:file.size || 0, url:url, time:nowTime()});
  save(state); renderSupport(); supMaybeReply();
}

/* ================= UI12 Profile photo ================= */
function applyProfilePhoto(dataUrl){
  if(!dataUrl) return;
  state.profilePhoto = dataUrl;
  save(state); renderProfile();
}
function removeProfilePhoto(){
  state.profilePhoto = '';
  save(state); renderProfile();
}
function triggerProfilePhoto(){ var f = el('pf-photo-file'); try{ if(f !== DUMMY && f.click) f.click(); }catch(e){} }
function onProfilePhotoPick(input){
  var file = input && input.files && input.files[0]; if(!file) return;
  processProfilePhotoFile(file);
  try{ input.value = ''; }catch(e){}
}
function processProfilePhotoFile(file){
  if(!file || !file.type || file.type.indexOf('image/') !== 0) return;
  var url = '';
  try{ url = URL.createObjectURL(file); }catch(e){}
  if(!url) return;
  var img = new Image();
  img.onload = function(){
    try{
      var max = 256, w = img.width || 256, h = img.height || 256, sc = Math.min(1, max / Math.max(w, h));
      var cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(w * sc)); cv.height = Math.max(1, Math.round(h * sc));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      applyProfilePhoto(cv.toDataURL('image/jpeg', 0.85));
    }catch(e){}
    try{ URL.revokeObjectURL(url); }catch(e){}
  };
  img.src = url;
}

try{
  el('add-date').value = todayISO();
  applyLang();
  setKind('expense');
  renderAll();
}catch(e){}
